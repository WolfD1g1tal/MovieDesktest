function norm(s) { return (s||"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim(); }
function parseSemi(text) {
  const lines = text.replace(/^\uFEFF/,"").trim().split(/\r?\n/);
  return lines.slice(1).map(line => {
    const cells = line.split(";");
    return { title: (cells[0]||"").trim(), imdbId: (cells[8]||"").trim() };
  }).filter(r => r.title);
}
function parseRatings(text) {
  const lines = text.replace(/^\uFEFF/,"").trim().split(/\r?\n/);
  if (!lines.length) return {};
  const headers = lines[0].split(",").map(h => h.trim().replace(/^"|"$/g,""));
  const constIdx = headers.findIndex(h => h === "Const");
  const ratingIdx = headers.findIndex(h => h === "Your Rating");
  if (constIdx < 0 || ratingIdx < 0) return {};
  const map = {};
  for (let i = 1; i < lines.length; i++) {
    const line = lines[i];
    // simple CSV split that respects quotes
    const cells = [];
    let cur = "", inQ = false;
    for (let c of line) {
      if (c === '"') { inQ = !inQ; continue; }
      if (c === ',' && !inQ) { cells.push(cur); cur = ""; }
      else cur += c;
    }
    cells.push(cur);
    const id = (cells[constIdx] || "").trim();
    const rating = (cells[ratingIdx] || "").trim();
    if (id && rating) map[id] = rating;
  }
  return map;
}

async function trySource(name, url, parse) {
  try {
    const res = await fetch(url);
    if (!res.ok) return { name, ok: false, title: null };
    const data = await res.json();
    const title = parse(data);
    return { name, ok: !!title, title: title || null };
  } catch (e) {
    return { name, ok: false, title: null };
  }
}

async function lookupBarcode(code) {
  const clean = (code || "").replace(/\D/g, "");
  if (!clean) return null;
  const candidates = [clean];
  if (clean.length === 13 && clean.startsWith("0")) candidates.push(clean.slice(1));
  if (clean.length === 12) candidates.push("0" + clean);

  const results = [];
  let foundTitle = null;

  for (const c of candidates) {
    if (foundTitle) break;
    // UPCitemdb
    const upc = await trySource("UPCitemdb",
      `https://barcode-proxy.frankiymydear.workers.dev/?upc=${encodeURIComponent(c)}`,
      d => (d.items && d.items[0] && (d.items[0].title || d.items[0].description)) || null);
    results.push(upc);
    if (upc.title) foundTitle = upc.title;

    // UPCMDB (movie-focused)
    if (!foundTitle) {
      const upcm = await trySource("UPCMDB",
        `https://upcmdb.com/api/v1/lookup/${encodeURIComponent(c)}`,
        d => d.data && d.data.title);
      results.push(upcm);
      if (upcm.title) foundTitle = upcm.title;
    }

    // Open Library (weak for movies but free)
    if (!foundTitle) {
      const ol = await trySource("OpenLibrary",
        `https://openlibrary.org/isbn/${encodeURIComponent(c)}.json`,
        d => d.title);
      results.push(ol);
      if (ol.title) foundTitle = ol.title;
    }
  }

  // Show status lights
  const status = $("barcodeStatus");
  if (status) {
    status.style.display = "block";
    const lines = results.map(r => (r.ok ? "??" : "??") + " " + r.name).join("<br>");
    status.innerHTML = "<b>Barcode lookup:</b><br>" + results.map(r => (r.ok ? "OK" : "FAIL") + " — " + r.name).join("<br>");
  }

  return { title: foundTitle, source: (results.find(r => r.title) || {}).name || "none", results: results };
}
function stopScan() {
  scanning = false;
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null;
  $("scanner").style.display = "none";
  $("video").srcObject = null;
}
async function startScan() {
  if (scanning) { stopScan(); return; }
  if (!window.BarcodeDetector) { showPopup("Barcode scanning not supported. Use Chrome on Android."); return; }
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
    const video = $("video");
    video.srcObject = stream;
    $("scanner").style.display = "block";
    scanning = true;
    const detector = new BarcodeDetector({ formats: ["ean_13","ean_8","upc_a","upc_e","code_128"] });

    // Give time to focus before detection starts
    const status = $("barcodeStatus");
    status.style.display = "block";
    status.innerHTML = "Hold steady — starting in 2 seconds...";
    await new Promise(r => setTimeout(r, 2000));
    if (!scanning) return;
    status.innerHTML = "Ready — hold the barcode in frame";

    let stable = null;
    let stableCount = 0;
    const loop = async () => {
      if (!scanning) return;
      try {
        const codes = await detector.detect(video);
        if (codes.length) {
          const raw = codes[0].rawValue;
          if (raw === stable) {
            stableCount++;
          } else {
            stable = raw;
            stableCount = 1;
          }
          // Require the same code for ~1s of frames before accepting
          if (stableCount >= 15) {
            stopScan();
            status.style.display = "none";
            const result = await lookupBarcode(raw);
            const title = result && result.title ? result.title : null;
            const source = result && result.source ? result.source : "none";
            $("newTitle").value = title || raw;
            $("newTitle").dataset.pendingId = "";
            const failed = (result.results || []).filter(r => !r.ok).map(r => r.name).join(", ");
            showPopup(title ? "Found via " + source + ": " + title : "Scanned " + raw + " — no title match. Tried: " + (failed || "none"));
            return;
          }
        } else {
          stable = null;
          stableCount = 0;
        }
      } catch (e) {}
      if (scanning) requestAnimationFrame(loop);
    };
    loop();
  } catch (e) {
    showPopup("Could not start camera.");
    stopScan();
  }
}
