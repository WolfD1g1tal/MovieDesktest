<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Movie Desk 0.7.018</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #0e0e0e; color: #eee; }
  header { padding: 16px; border-bottom: 1px solid #222; position: sticky; top: 0; background: #0e0e0e; z-index: 10; }
  h1 { margin: 0; }
  .sub { color: #888; font-size: 0.8rem; }
  main { padding: 16px; max-width: 680px; margin: 0 auto; }
  input[type=search], input[type=text] { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid #333; background: #1a1a1a; color: #fff; margin: 6px 0; box-sizing: border-box; }
  .add-wrap, .buy-wrap { position: relative; margin-bottom: 8px; }
  .add-row, .buy-row { display: flex; gap: 8px; align-items: center; }
  .add-row input, .buy-row input { flex: 1; margin: 0; }
  button { background: #222; color: #eee; border: 1px solid #444; padding: 0 16px; border-radius: 12px; cursor: pointer; height: 48px; }
  .suggest, .buy-results { position: absolute; top: 100%; left: 0; right: 0; background: #1a1a1a; border: 1px solid #333; border-radius: 8px; max-height: 220px; overflow-y: auto; -webkit-overflow-scrolling: touch; z-index: 20; display: none; }
  .suggest.show, .buy-results.show { display: block; }
  .suggest div, .buy-results div { padding: 12px 14px; cursor: pointer; border-bottom: 1px solid #2a2a2a; }
  .suggest div:hover, .buy-results div:hover { background: #2a2a2a; }
  #scanner { display: none; margin: 12px 0; }
  #scanner video { width: 100%; border-radius: 12px; background: #000; }
  .card { background: #161616; border: 1px solid #2a2a2a; border-radius: 12px; padding: 12px; margin-bottom: 10px; display: flex; gap: 14px; align-items: flex-start; }
  .card-cover { width: 120px; height: 180px; object-fit: cover; border-radius: 6px; background: #222; flex-shrink: 0; }
  .card-body { flex: 1; min-width: 0; }
  .card-title { font-weight: 500; font-size: 1.05rem; margin: 0 0 2px; cursor: pointer; }
  .card-meta { color: #aaa; font-size: 0.8rem; margin: 2px 0 6px; }
  .card-added { color: #777; font-size: 0.72rem; margin: 0 0 6px; }
  .card-flags { display: flex; flex-wrap: wrap; gap: 6px; }
  .nav { display: flex; gap: 4px; margin: 8px 0; }
  .nav button { flex: 1; height: 40px; font-size: 0.85rem; }
  .nav button.active { background: #333; border-color: #666; }
  .tool-row { display: flex; gap: 8px; margin: 8px 0; }
  .tool-row select { flex: 1; height: 40px; border-radius: 12px; border: 1px solid #333; background: #1a1a1a; color: #eee; padding: 0 8px; }
  #filterBtn.on { border-color: #8ab4f8; color: #8ab4f8; }
  .filter-panel { display: none; background: #161616; border: 1px solid #2a2a2a; border-radius: 12px; padding: 10px; margin-bottom: 10px; }
  .filter-panel.open { display: block; }
  .filter-panel label { display: block; color: #aaa; font-size: 0.8rem; margin: 6px 0; }
  .filter-panel select { width: 100%; height: 40px; margin-top: 4px; border-radius: 12px; border: 1px solid #333; background: #1a1a1a; color: #eee; padding: 0 8px; }
  .section { display: none; }
  .section.active { display: block; }
  .watch-row { padding: 8px 0; border-bottom: 1px solid #222; }
  .child-list { margin-top: 8px; margin-left: 24px; border-left: 2px solid #6a3a8a; padding-left: 10px; display: none; }
  .child-list.show { display: block; }
  .child-item { background: #2a1a3a; border: 1px solid #5a3a7a; border-radius: 6px; padding: 8px; margin: 4px 0; color: #d0a0e0; }
  .flag { padding: 4px 10px; border-radius: 999px; font-size: 0.78rem; font-weight: 600; }
  .own { background: #1a3a2a; color: #7dcea0; }
  .gay-no { background: #1a2a3a; color: #8ab4e0; cursor: pointer; }
  .gay-yes { background: #3a1a2a; color: #e08ab4; cursor: pointer; }
  .imdb { background: #2a2a1a; color: #e0c07a; }
  .you { background: #0a2a2a; color: #00e5ff; }
  .pkg { background: #2a1a2a; color: #e0a07a; }
  .child-drop { background: #2a1a3a; color: #e0a0ff; border: 1px solid #5a3a7a; border-radius: 8px; padding: 4px; font-size: 0.85rem; font-weight: 600; width: 100%; max-width: 320px; height: auto; }
  .child-list { margin-top: 8px; border-top: 1px solid #333; padding-top: 8px; }
  .child-item { background: #222; border: 1px solid #444; border-radius: 6px; padding: 8px; margin: 4px 0; }
  label.load { display: inline-block; background: #222; border: 1px solid #444; padding: 10px 14px; border-radius: 8px; cursor: pointer; margin-right: 8px; }
  input[type=file] { display: none; }
  .section-label { color: #888; font-size: 0.85rem; margin: 16px 0 4px; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 9999; }
  .modal.show { display: flex !important; }
  .modal-box { background: #1a1a1a; border: 1px solid #333; border-radius: 16px; padding: 20px; max-width: 320px; width: 90%; }
  .modal-box p { margin: 0 0 16px; white-space: pre-line; }
  .modal-box label { display: block; margin: 8px 0; font-size: 0.9rem; }
  .modal-box button { height: auto; background: #333; color: #fff; border: none; padding: 10px 20px; border-radius: 8px; float: right; }

  .disc-badge { display: inline-flex; align-items: center; justify-content: center; position: relative; overflow: hidden; height: 22px; min-width: 40px; padding: 0 8px; border-radius: 5px; font-size: 11px; font-weight: 800; letter-spacing: 0.08em; line-height: 1; vertical-align: middle; box-shadow: inset 0 1px 0 rgba(255,255,255,.9), inset 0 -2px 3px rgba(0,0,0,.38), 0 1px 2px rgba(0,0,0,.55); }
  .disc-face { position: relative; z-index: 1; }
  .disc-badge::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 48%; background: linear-gradient(180deg, rgba(255,255,255,.62), rgba(255,255,255,0)); pointer-events: none; }
  .kind-uhd { color: #3a2706; text-shadow: 0 1px 0 rgba(255,248,220,.75); background: linear-gradient(180deg, rgba(255,255,255,.45) 0%, rgba(255,255,255,0) 46%, rgba(70,40,0,.2) 100%), linear-gradient(108deg, #6e4e10 0%, #e7c56b 20%, #fff6d4 38%, #a97812 54%, #ffe7a3 72%, #5c430e 100%); }
  .kind-blu { color: #f4f9ff; text-shadow: 0 1px 0 rgba(0,16,36,.6); background: linear-gradient(180deg, rgba(255,255,255,.42) 0%, rgba(255,255,255,0) 44%, rgba(0,12,28,.3) 100%), linear-gradient(108deg, #0b3a6c 0%, #8ec4f2 22%, #f7fbff 40%, #1a6aaf 56%, #d4ebff 74%, #082848 100%); }
  .kind-dvd { color: #2c3136; text-shadow: 0 1px 0 rgba(255,255,255,.8); background: linear-gradient(180deg, rgba(255,255,255,.72) 0%, rgba(255,255,255,0) 46%, rgba(0,0,0,.22) 100%), linear-gradient(108deg, #5e646b 0%, #d8dee5 20%, #ffffff 40%, #8e969e 55%, #f4f6f8 73%, #4e545a 100%); }
  .disc-badge.fx-shimmer::after { content: ""; position: absolute; top: -30%; bottom: -30%; width: 38%; left: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,.8), transparent); transform: translateX(-180%); animation: badge-sweep 3.2s ease-in-out infinite; pointer-events: none; }
  .disc-badge.fx-glow::after { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 50% 35%, rgba(255,255,255,.7), transparent 68%); opacity: .2; animation: badge-glow 2.6s ease-in-out infinite; pointer-events: none; }
  @keyframes badge-sweep { 0% { transform: translateX(-180%); } 100% { transform: translateX(430%); } }
  @keyframes badge-glow { 0%, 100% { opacity: .12; } 50% { opacity: .9; } }
  @media (prefers-reduced-motion: reduce) { .disc-badge.fx-shimmer::after, .disc-badge.fx-glow::after { animation: none; } }
  .fx-group { margin: 0 0 14px; }
  .fx-head { font-weight: 600; margin-bottom: 4px; }
  .fx-choices { display: flex; flex-direction: column; gap: 6px; }
  .fx-pick { height: auto; display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 8px 10px; background: #141414; border-radius: 10px; }
  .fx-pick.on { border-color: #c9a227; background: #1c1a14; }
  .fx-name { font-size: 0.85rem; line-height: 1.25; }
</style>
</head>

<script>
function closeModal(){
  var m = document.getElementById("modal");
  if (m) { m.className = "modal"; m.style.display = "none"; }
  document.body.style.overflow = "";
}
const OMDB_KEY = "8d83ba51";
const TMDB_KEY = "29c3cb82fa06b97815b502bb02cee215";
const UPCMDB_KEY = "d207a24928dc0f20f056afe5cb887437";
const UPCDATABASE_KEY = "7451A8510DEE05A60529AAE24745905D";
const $ = id => document.getElementById(id);
let collection = JSON.parse(localStorage.getItem("md_coll") || "[]");
let manualTitles = JSON.parse(localStorage.getItem("md_manual") || "[]");
let homoFlags = JSON.parse(localStorage.getItem("md_homo") || "{}");
let boutiqueFlags = JSON.parse(localStorage.getItem("md_boutique") || "{}");
const BOUTIQUE_LABELS = ["Arrow","Manta Labs","Kino Lorber","Criterion","Vinegar Syndrome","Severin","Scream Factory","Shout Factory","88 Films","Eureka","Indicator"];
function stripBoutique(label) {
  if (!label) return;
  const l = label.toLowerCase();
  const ids = Object.keys(boutiqueFlags).filter(id => (boutiqueFlags[id] || "").toLowerCase() === l);
  if (!ids.length) { showPopup("No titles marked " + label); return; }
  if (!confirm("Remove " + ids.length + " title(s) marked " + label + "?")) return;
  manualTitles = manualTitles.filter(m => !ids.includes(m.id));
  ids.forEach(id => delete boutiqueFlags[id]);
  saveManual();
  saveBoutique();
  render();
  showPopup("Stripped " + ids.length + " " + label + " title(s)");
}
let ratingsById = {};
let myRatings = {};
let myRatingsById = {};
let dbPromise = null;
function openDb() {
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open("MovieDesk", 3);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains("ratings")) db.createObjectStore("ratings");
      if (!db.objectStoreNames.contains("boutique")) db.createObjectStore("boutique");
      if (!db.objectStoreNames.contains("watch")) db.createObjectStore("watch");
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return dbPromise;
}
async function idbGetAll(store) {
  const db = await openDb();
  return new Promise(resolve => {
    const tx = db.transaction(store, "readonly");
    const req = tx.objectStore(store).getAll();
    const keysReq = tx.objectStore(store).getAllKeys();
    let vals, keys;
    req.onsuccess = () => { vals = req.result; if (keys) finish(); };
    keysReq.onsuccess = () => { keys = keysReq.result; if (vals) finish(); };
    function finish() {
      const map = {};
      keys.forEach((k, i) => map[k] = vals[i]);
      resolve(map);
    }
  });
}
async function idbPutMap(store, map) {
  const db = await openDb();
  return new Promise(resolve => {
    const tx = db.transaction(store, "readwrite");
    const os = tx.objectStore(store);
    os.clear();
    Object.keys(map).forEach(k => os.put(map[k], k));
    tx.oncomplete = () => resolve();
  });
}
async function idbClear(store) {
  const db = await openDb();
  return new Promise(resolve => {
    const tx = db.transaction(store, "readwrite");
    tx.objectStore(store).clear();
    tx.oncomplete = () => resolve();
  });
}
async function loadRatingsFromDb() {
  try {
    const raw = await idbGetAll("ratings");
    myRatings = {};
    myRatingsById = {};
    if (raw && raw.__v2 && raw.__v2.byTitle) {
      myRatings = raw.__v2.byTitle || {};
      myRatingsById = raw.__v2.byId || {};
    } else {
      Object.keys(raw || {}).forEach(k => {
        const v = raw[k];
        if (typeof v === "string" && v) myRatings[k] = [{ rating: v, date: "", imdbId: "", title: "", year: "", type: "" }];
      });
    }
    if (typeof render === "function") render();
  } catch(e) {}
}
function ratingList(title) {
  const v = myRatings[norm(title || "")];
  if (!v) return [];
  if (typeof v === "string") return [{ rating: v, date: "", imdbId: "", year: "", type: "", title: title || "" }];
  if (Array.isArray(v)) return v;
  if (v && v.rating) return [v];
  return [];
}
function ratingRecFor(m) {
  if (!m) return null;
  const id = String(m.imdbId || "").trim();
  if (id && myRatingsById[id]) return myRatingsById[id];
  const list = ratingList(m.title);
  if (!list.length) return null;
  const y = String(m.year || m.release || "").match(/(19|20)\d{2}/);
  if (y) {
    const hits = list.filter(r => String(r.year || "") === y[0]);
    if (hits.length) return hits[0];
  }
  return list[0];
}
function formatRatingDate(s) {
  const m = String(s || "").match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!m) return "";
  return String(parseInt(m[2], 10)) + "/" + String(parseInt(m[3], 10)) + "/" + m[1];
}
function ratingBadge(m) {
  const r = ratingRecFor(m);
  if (!r || !r.rating) return "";

const RATING_SKIP = { "tv episode": 1, "video game": 1, "podcast series": 1, "podcast episode": 1, "music video": 1 };
function indexRatingsCsv(text) {
  const lines = String(text || "").split(/\r?\n/).filter(l => l.trim());
  if (!lines.length) return { kept: 0, skipped: 0, empty: true };
  const header = parseCsvLine(lines[0]).map(h => h.trim().toLowerCase());
  const col = name => header.findIndex(h => h === name);
  const titleIdx = col("title");
  const ratingIdx = col("your rating");
  const dateIdx = col("date rated");
  const idIdx = header.findIndex(h => h === "const" || h === "imdb id" || h === "tconst");
  const yearIdx = col("year");
  const typeIdx = col("title type");
  const byId = {};
  const byTitle = {};
  let kept = 0, skipped = 0;
  for (let i = 1; i < lines.length; i++) {
    const cols = parseCsvLine(lines[i]);
    const type = typeIdx >= 0 ? (cols[typeIdx] || "").trim() : "";
    if (type && RATING_SKIP[type.toLowerCase()]) { skipped++; continue; }
    const title = (cols[titleIdx >= 0 ? titleIdx : 3] || "").trim();
    const rating = (cols[ratingIdx >= 0 ? ratingIdx : 1] || "").trim();
    if (!title || !rating) continue;
    const imdbId = idIdx >= 0 ? (cols[idIdx] || "").trim() : "";
    const rec = {
      rating: rating,
      date: dateIdx >= 0 ? (cols[dateIdx] || "").trim() : "",
      imdbId: imdbId,
      title: title,
      year: yearIdx >= 0 ? (cols[yearIdx] || "").trim() : "",
      type: type
    };
    const key = norm(title);
    if (!byTitle[key]) byTitle[key] = [];
    byTitle[key].push(rec);
    if (imdbId) byId[imdbId] = rec;
    kept++;
  }
  myRatings = byTitle;
  myRatingsById = byId;
  return { kept: kept, skipped: skipped };
}

function parseCsvLine(line) {
  const out = [];
  let cur = "", inQ = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') { if (inQ && line[i+1] === '"') { cur += '"'; i++; } else inQ = !inQ; }
    else if (c === "," && !inQ) { out.push(cur); cur = ""; }
    else cur += c;
  }
  out.push(cur);
  return out;
}

function cleanTitle(raw) {
  if (!raw) return "";
  let t = raw;
  // Strip common studio prefixes (Warner Brothers, Universal, etc.)
  t = t.replace(/^(Warner\s+Brothers|Warner\s+Bros\.?|Universal|Paramount|Sony|Columbia|Disney|MGM|20th\s+Century(\s+Fox)?|Lionsgate|Lions\s*Gate|New\s+Line|DreamWorks|Fox|Miramax|Orion|Touchstone|Hollywood\s+Pictures)\s+/i, "");
  // Strip common physical media suffixes and studio noise
  t = t.replace(/\s*[\(\[]?\s*(Blu[- ]?ray|BluRay|BD|DVD|4K|UHD|Ultra\s*HD|Digital|Combo|Disc|Edition|Special|Collector|Steelbook|Slipcover).*[\)\]]?/gi, "");
  t = t.replace(/\s*[---]\s*(Blu[- ]?ray|DVD|4K).*$/gi, "");
  t = t.replace(/\s*\d+\s*Disc(s)?\b/gi, "");
  t = t.replace(/\s*\([^)]*\)\s*$/g, ""); // trailing paren groups
  t = t.replace(/\s+/g, " ").trim();
  return t || raw;
}

async function lookupBarcode(code) {
  const clean = (code || "").replace(/\D/g, "");
  if (!clean) return null;
  const candidates = [clean];
  if (clean.length === 13 && clean.startsWith("0")) candidates.push(clean.slice(1));
  if (clean.length === 12) candidates.push("0" + clean);

  const results = [];
  const matches = []; // {title, source}

  // Always try all sources on the primary barcode
  const c = candidates[0];

  // 1st: UPCMDB (movie-specific, 500/month)
  try {
    const res = await fetch(`https://us-central1-upcmdb-cbae5.cloudfunctions.net/api/v1/lookup/${encodeURIComponent(c)}`, {
      headers: { "x-api-key": UPCMDB_KEY }
    });
    if (res.ok) {
      const d = await res.json();
      const title = d.title || (d.data && d.data.title);
      results.push({ name: "UPCMDB", ok: !!title, title: title || null, data: d });
      if (title) {
        matches.push({ title, source: "UPCMDB", imdbId: d.imdbID || (d.data && d.data.imdbID) || "" });
        // good hit - skip the rest
      }
    } else {
      results.push({ name: "UPCMDB", ok: false, title: null, data: null });
    }
  } catch (e) {
    results.push({ name: "UPCMDB", ok: false, title: null, data: null });
  }

  // Only fall through if UPCMDB missed
  if (!matches.length) {
  // 2nd: UPCDatabase.org
  if (UPCDATABASE_KEY) {
    const upcdb = await trySource("UPCDatabase",
      `https://proxy.cors.dev/https://api.upcdatabase.org/product/${encodeURIComponent(c)}?apikey=${UPCDATABASE_KEY}`,
      d => (d.success && (d.title || d.itemname)) || null);
    results.push(upcdb);
    if (upcdb.title) matches.push({ title: upcdb.title, source: "UPCDatabase" });
  }

  // 3rd: GTINHub via CORS proxy
  const gtin = await trySource("GTINHub",
    `https://proxy.cors.dev/https://gtinhub.com/api/v1/product/${encodeURIComponent(c)}`,
    d => d.found && d.product && (d.product.name || d.product.title) || null);
  results.push(gtin);
  if (gtin.title) matches.push({ title: gtin.title, source: "GTINHub" });

  // 4th: UPCitemdb via proxy
  const upc = await trySource("UPCitemdb-proxy",
    `https://barcode-proxy.frankiymydear.workers.dev/?upc=${encodeURIComponent(c)}`,
    d => (d.items && d.items[0] && (d.items[0].title || d.items[0].description)) || null);
  results.push(upc);
  if (upc.title) matches.push({ title: upc.title, source: "UPCitemdb-proxy" });

  // UPCDatabase moved to 2nd
  if (!matches.length && candidates.length > 1) {
    for (const alt of candidates.slice(1)) {
      const altUpc = await trySource("UPCitemdb-proxy-alt",
        `https://barcode-proxy.frankiymydear.workers.dev/?upc=${encodeURIComponent(alt)}`,
        d => (d.items && d.items[0] && (d.items[0].title || d.items[0].description)) || null);
      results.push(altUpc);
      if (altUpc.title) {
        matches.push({ title: altUpc.title, source: "UPCitemdb-proxy" });
        break;
      }
    }
  }
  } // end UPCMDB fallback

  const status = $("barcodeStatus");
  if (status) {
    status.style.display = "block";
    const lines = results.map(r => (r.ok ? "OK" : "FAIL") + " - " + r.name).join("<br>");
    status.innerHTML = "<b>Barcode lookup:</b><br>" + lines +
      (matches.length ? "<br><b>Matches found:</b> " + matches.length : "");
  }

  return {
    matches,
    results,
    barcode: clean
  };
}

async function ensureBarcodeDetector() {

    s.onload = () => resolve(!!window.BarcodeDetector);

async function startScan(target) {
  if (scanning) { stopScan(); return; }
  const status = $("barcodeStatus");
  status.style.display = "block";
  status.innerHTML = "Starting camera...";
  if (!window.BarcodeDetector) {
    status.innerHTML = "Loading iPhone scanner...";
    const ok = await ensureBarcodeDetector();
    if (!ok) { showPopup("Barcode scanning not available in this browser."); return; }
  }
  scanTarget = target;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
    const video = $("video");
    video.srcObject = stream;
    $("scanner").style.display = "block";
    await video.play();
    scanning = true;
    const detector = new BarcodeDetector({ formats: ["ean_13","ean_8","upc_a","upc_e","code_128"] });

    // Wait until the video has frames
    status.innerHTML = "Focusing - hold steady...";
    let readyTries = 0;
    while (video.readyState < 2 && readyTries < 30 && scanning) {
      await new Promise(r => setTimeout(r, 100));
      readyTries++;
    }
    if (!scanning) return;
    status.innerHTML = "Ready - hold the barcode in frame (auto)";

    // Canvas path: more reliable on iPhone Safari than detect(video)
    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d", { willReadFrequently: true });

    let stable = null;
    let stableCount = 0;
    const loop = async () => {
      if (!scanning) return;
      try {
        if (video.videoWidth && video.videoHeight) {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        }
        const codes = await detector.detect(canvas);
        if (codes.length) {
          const raw = codes[0].rawValue;
          if (raw === stable) stableCount++;
          else { stable = raw; stableCount = 1; }
          status.innerHTML = "Saw: " + raw + " (" + stableCount + "/8) - hold steady";
          if (stableCount >= 8) {
            const rawFinal = raw;
            status.innerHTML = "Locked - " + rawFinal + "...";
            // short deliberate pause so the lock is visible
            await new Promise(r => setTimeout(r, 600));
            if (!scanning) return;
            stopScan();
            status.innerHTML = "Looking up " + rawFinal + "...";
            const result = await lookupBarcode(rawFinal);
            const field = target === "mother" ? $("motherTitle") : $("childTitle");
            const box = target === "mother" ? $("motherSuggest") : $("childSuggest");
            field.dataset.barcode = result ? result.barcode : rawFinal;
            const hits = (result && result.matches) || [];
            field.dataset.rawTitle = (hits[0] && hits[0].title) || rawFinal;
            field.dataset.discType = detectDiscType(field.dataset.rawTitle);
            if (hits.length) {
              box.innerHTML = hits.map(m => {
                const safe = (m.title || "").replace(/"/g, "&quot;");
                return `<div data-title="${safe}" data-source="${m.source}">${m.title} <span style="color:#888;font-size:0.75rem">(${m.source})</span></div>`;
              }).join("");
              box.classList.add("show");
              box.querySelectorAll("div").forEach(el => {
                el.onclick = () => {
                  field.value = el.dataset.title;
                  field.dataset.imdbId = "";
                  field.dataset.publicRating = "";
                  box.classList.remove("show");
                  showPopup("Selected: " + el.dataset.title);
                };
              });
              field.value = hits[0].title;
              showPopup(hits.length + " match" + (hits.length>1?"es":"") + " - pick one from the list.");
            } else {
              field.value = rawFinal;
              box.classList.remove("show");
              showPopup("Scanned " + rawFinal + " - no title match.");
            }
            return;
          }
        } else {
          stable = null;
          stableCount = 0;
          status.innerHTML = "Looking... hold the barcode steady (auto)";
        }
      } catch (e) {
        status.innerHTML = "Detect error: " + (e.message || e);
      }
      if (scanning) requestAnimationFrame(loop);
    };
    loop();
  } catch (e) {
    showPopup("Could not start camera: " + (e.message || e));
    stopScan();
  }
}

function boutiqueSuggest(query, box) {
  const digits = (query || "").replace(/\D/g, "");
  if (digits.length < 8) return false;
  const hits = [];
  const keys = Object.keys(boutiqueCatalog);
  for (let i = 0; i < keys.length && hits.length < 33; i++) {
    const bc = keys[i];
    if (bc.indexOf(digits) === -1) continue;
    const row = boutiqueCatalog[bc];
    if (row) hits.push({ barcode: bc, title: row.title || bc, label: row.label || "", edition: row.edition || "", coverUrl: row.coverUrl || "" });
  }
  if (!hits.length) return false;
  box.innerHTML = hits.map(h => `<div data-barcode="${h.barcode}" data-title="${(h.title||"").replace(/"/g,"&quot;")}" data-label="${(h.label||"").replace(/"/g,"&quot;")}" data-edition="${(h.edition||"").replace(/"/g,"&quot;")}" data-cover="${(h.coverUrl||"").replace(/"/g,"&quot;")}">${h.title}${h.label ? " | " + h.label : ""}${h.edition ? " | " + h.edition : ""}<br><span style="color:#888;font-size:0.75rem">${h.barcode}</span></div>`).join("");
  box.classList.add("show");
  box.querySelectorAll("div").forEach(el => {
    el.onclick = () => {
      const field = box.id === "motherSuggest" ? $("motherTitle") : $("childTitle");
      field.value = el.dataset.title || el.dataset.barcode;
      field.dataset.barcode = el.dataset.barcode || "";
      field.dataset.boutiqueLabel = el.dataset.label || "";
      field.dataset.edition = el.dataset.edition || "";
      field.dataset.coverUrl = el.dataset.cover || "";
      box.classList.remove("show");
    };
  });
  return true;
}
async function barcodeExternalSuggest(query, box) {
  const digits = (query || "").replace(/\D/g, "");
  if (digits.length < 10) return false;
  try {
    const result = await lookupBarcode(digits);
    if (!result || !result.matches || !result.matches.length) return false;
    box.innerHTML = result.matches.slice(0, 20).map(m => {
      const t = (m.title || "").replace(/"/g, "&quot;");
      return `<div data-barcode="${digits}" data-title="${t}" data-id="${m.imdbId || ""}">${m.title}<br><span style="color:#888;font-size:0.75rem">${digits} | ${m.source || "lookup"}</span></div>`;
    }).join("");
    box.classList.add("show");
    box.querySelectorAll("div").forEach(el => {
      el.onclick = () => {
        const field = box.id === "motherSuggest" ? $("motherTitle") : $("childTitle");
        field.value = el.dataset.title || digits;
        field.dataset.barcode = el.dataset.barcode || "";
        field.dataset.imdbId = el.dataset.id || "";
        box.classList.remove("show");
      };
    });
    return true;
  } catch (e) {
    return false;
  }
}

async function omdbSuggest(query, box) {
  if (boutiqueSuggest(query, box)) return;
  const digits = (query || "").replace(/\D/g, "");
  if (digits.length >= 10 && digits.length >= (query || "").length - 2) {
    if (await barcodeExternalSuggest(query, box)) return;
  }
  if (!query || query.length < 3) { box.classList.remove("show"); return; }
  try {
    const pages = [1, 2, 3, 4];
    const all = [];
    for (const p of pages) {
      if (all.length >= 33) break;
      const res = await fetch(`https://www.omdbapi.com/?s=${encodeURIComponent(query)}&page=${p}&apikey=${OMDB_KEY}`);
      const d = await res.json();
      if (!d.Search || !d.Search.length) break;
      all.push(...d.Search);
      if (d.Search.length < 10) break;
    }
    if (all.length) {
      box.innerHTML = all.slice(0, 33).map(m => `<div data-title="${m.Title}" data-id="${m.imdbID}">${m.Title} (${m.Year})</div>`).join("");
      box.classList.add("show");
      box.querySelectorAll("div").forEach(el => {
        el.onclick = () => {
          const field = box.id === "motherSuggest" ? $("motherTitle") : $("childTitle");
          field.value = el.dataset.title;
          field.dataset.imdbId = el.dataset.id;
          box.classList.remove("show");
        };
      });
    } else box.classList.remove("show");
  } catch(e) { box.classList.remove("show"); }
}


async function tmdbPosters(m) {
  if (!TMDB_KEY || !m) return [];
  let kind = "movie";
  let id = null;
  try {
    if (m.imdbId) {
      const res = await fetch("https://api.themoviedb.org/3/find/" + encodeURIComponent(m.imdbId) + "?external_source=imdb_id&api_key=" + TMDB_KEY);
      const d = await res.json();
      if (d.movie_results && d.movie_results[0]) { id = d.movie_results[0].id; kind = "movie"; }
      else if (d.tv_results && d.tv_results[0]) { id = d.tv_results[0].id; kind = "tv"; }
    }
    if (!id && m.title) {
      const y = String(m.year || m.release || "").match(/(19|20)\d{2}/);
      let url = "https://api.themoviedb.org/3/search/movie?query=" + encodeURIComponent(m.title) + "&api_key=" + TMDB_KEY;
      if (y) url += "&year=" + y[0];
      const res = await fetch(url);
      const d = await res.json();
      if (d.results && d.results[0]) { id = d.results[0].id; kind = "movie"; }
      else {
        const res2 = await fetch("https://api.themoviedb.org/3/search/tv?query=" + encodeURIComponent(m.title) + "&api_key=" + TMDB_KEY);
        const d2 = await res2.json();
        if (d2.results && d2.results[0]) { id = d2.results[0].id; kind = "tv"; }
      }
    }
    if (!id) return [];
    const res = await fetch("https://api.themoviedb.org/3/" + kind + "/" + id + "/images?api_key=" + TMDB_KEY);
    const d = await res.json();
    const posters = (d.posters || []).slice();
    const rank = p => p.iso_639_1 === "en" ? 0 : (p.iso_639_1 == null || p.iso_639_1 === "") ? 1 : 2;
    posters.sort((a, b) => {
      const dlt = rank(a) - rank(b);
      if (dlt) return dlt;
      return (b.vote_average || 0) - (a.vote_average || 0);
    });
    return posters.filter(p => p.file_path).map(p => ({
      url: "https://image.tmdb.org/t/p/w780" + p.file_path,
      thumb: "https://image.tmdb.org/t/p/w185" + p.file_path,
      label: (p.iso_639_1 == null || p.iso_639_1 === "") ? "TMDB · textless" : ("TMDB · " + p.iso_639_1)
    }));
  } catch (e) { return []; }
}

function boutiqueCoverList(row) {
  if (!row) return [];
  if (Array.isArray(row.covers) && row.covers.length) return row.covers.filter(c => c && c.url);
  if (row.coverUrl) return [{ url: row.coverUrl, label: row.label || "Boutique", edition: row.edition || "" }];
  return [];
}

async function gatherCovers(m) {
  const urls = [];
  const seen = new Set();
  function add(url, label, source, thumb) {
    if (!url || url === "N/A" || seen.has(url)) return;
    seen.add(url);
    urls.push({ url, label, source: source || "other", thumb: thumb || url });
  }
  const bout = lookupBoutique(m.barcode);
  boutiqueCoverList(bout).forEach(c => {
    const bits = ["Boutique"];
    if (c.label && c.label !== "Boutique") bits.push(c.label);
    if (c.edition) bits.push(c.edition);
    add(c.url, bits.join(" · "), "boutique");
  });
  if (m.coverUrl) add(m.coverUrl, "Current", "other");
  try {
    const posters = await tmdbPosters(m);
    posters.forEach(p => add(p.url, p.label, "tmdb", p.thumb));
  } catch (e) {}
  if (OMDB_KEY && m.imdbId) {
    try {
      const res = await fetch("https://www.omdbapi.com/?i=" + encodeURIComponent(m.imdbId) + "&apikey=" + OMDB_KEY);
      const d = await res.json();
      if (d && d.Poster) add(d.Poster, "OMDB", "other");
    } catch (e) {}
  }
  if (m.barcode) {
    try {
      const res = await fetch("https://barcode-proxy.frankiymydear.workers.dev/?upc=" + encodeURIComponent(m.barcode));
      const d = await res.json();
      const item = d.items && d.items[0];
      if (item && item.images) {
        for (const img of item.images.slice(0, 3)) add(img, "UPC", "other");
      }
    } catch (e) {}
  }
  return urls;
}

function openCropper(url, id) {
  const box = document.getElementById("coverPicker");
  const panel = document.getElementById("coverPanel");
  if (!panel) return;
  panel.innerHTML = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><span>Crop cover</span><button type="button" id="cropCancel" style="background:none;border:none;color:#aaa;font-size:1.2rem">?</button></div><canvas id="cropCanvas" style="width:100%;max-height:60vh;background:#111;border-radius:8px;touch-action:none"></canvas><p style="font-size:0.8rem;color:#888;margin:6px 0">Drag to select crop area</p><div style="display:flex;gap:8px"><button id="cropApply" type="button" style="flex:1;height:40px;background:#333;color:#fff;border:none;border-radius:8px">Use crop</button><button id="cropSkip" type="button" style="flex:1;height:40px;background:#222;color:#aaa;border:none;border-radius:8px">Use original</button></div>';
  const canvas = document.getElementById("cropCanvas");
  const ctx = canvas.getContext("2d");
  const img = new Image();
  img.crossOrigin = "anonymous";
  img.onload = () => {
    const maxW = panel.clientWidth - 24 || 400;
    const scale = Math.min(1, maxW / img.width, 400 / img.height);
    canvas.width = img.width * scale;
    canvas.height = img.height * scale;
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    let startX, startY, endX, endY, dragging = false;
    function drawSel() {
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      if (dragging || (startX != null)) {
        const x = Math.min(startX, endX), y = Math.min(startY, endY);
        const w = Math.abs(endX - startX), h = Math.abs(endY - startY);
        ctx.strokeStyle = "#6af"; ctx.lineWidth = 2;
        ctx.strokeRect(x, y, w, h);
        ctx.fillStyle = "rgba(0,0,0,0.4)";
        ctx.fillRect(0, 0, canvas.width, y);
        ctx.fillRect(0, y + h, canvas.width, canvas.height - y - h);
        ctx.fillRect(0, y, x, h);
        ctx.fillRect(x + w, y, canvas.width - x - w, h);
      }
    }
    function pos(e) {
      const r = canvas.getBoundingClientRect();
      const t = e.touches ? e.touches[0] : e;
      return { x: (t.clientX - r.left) * (canvas.width / r.width), y: (t.clientY - r.top) * (canvas.height / r.height) };
    }
    canvas.onmousedown = canvas.ontouchstart = e => { e.preventDefault(); const p = pos(e); startX = endX = p.x; startY = endY = p.y; dragging = true; };
    canvas.onmousemove = canvas.ontouchmove = e => { if (!dragging) return; e.preventDefault(); const p = pos(e); endX = p.x; endY = p.y; drawSel(); };
    canvas.onmouseup = canvas.ontouchend = () => { dragging = false; drawSel(); };
    document.getElementById("cropApply").onclick = () => {
      if (startX == null) { setCover(id, url); box.style.display = "none"; return; }
      const x = Math.min(startX, endX) / scale, y = Math.min(startY, endY) / scale;
      const w = Math.abs(endX - startX) / scale, h = Math.abs(endY - startY) / scale;
      if (w < 10 || h < 10) { setCover(id, url); box.style.display = "none"; return; }
      const c2 = document.createElement("canvas");
      c2.width = w; c2.height = h;
      c2.getContext("2d").drawImage(img, x, y, w, h, 0, 0, w, h);
      setCover(id, c2.toDataURL("image/jpeg", 0.85));
      box.style.display = "none";
    };
    document.getElementById("cropSkip").onclick = () => { setCover(id, url); box.style.display = "none"; };
    document.getElementById("cropCancel").onclick = () => { box.style.display = "none"; };
  };
  img.onerror = () => { setCover(id, url); box.style.display = "none"; };
  img.src = url;
}

function discBadge(bucket, fxMap) {
  if (bucket !== "uhd" && bucket !== "blu" && bucket !== "dvd") return "";
  const fx = (fxMap && fxMap[bucket]) || "polish";
  const text = bucket === "uhd" ? "4K" : bucket === "blu" ? "BLU" : "DVD";
  const tip = bucket === "uhd" ? "4K" : bucket === "blu" ? "Blu-ray" : "DVD";
  const safeFx = (fx === "shimmer" || fx === "glow") ? fx : "polish";
  return '<span class="disc-badge kind-' + bucket + ' fx-' + safeFx + '" title="' + tip + '"><span class="disc-face">' + text + '</span></span>';
}
function discBucket(m) {
  const d = ((m.discType || "") + " " + (m.edition || "")).toLowerCase();
  const t = (m.title || "").toLowerCase();
  if (/ultra|\buhd\b|\b4k\b/.test(d) || /\b4k\b|\buhd\b|ultra hd/.test(t)) return "uhd";
  if (/blu/.test(d)) return "blu";
  if (/\bdvd\b/.test(d)) return "dvd";
  return "other";
}
function numRating(v) {
  const n = parseFloat(String(v || "").replace(/[^\d.]/g, ""));
  return isNaN(n) ? -1 : n;
}
function releaseTime(m) {
  const raw = String(m.release || m.year || "").trim();
  if (!raw) return 0;
  const parsed = Date.parse(raw);
  if (!isNaN(parsed)) return parsed;
  const y = raw.match(/(19|20)\d{2}/);
  return y ? Date.UTC(parseInt(y[0], 10), 0, 1) : 0;
}
function homoKey(m) {
  return m.title + "|" + (m.barcode || "") + "|" + (m.edition || "");
}
function activeFilterCount() {
  let n = 0;
  if ($("filterDisc") && $("filterDisc").value) n++;
  if ($("filterBout") && $("filterBout").value) n++;
  if ($("filterHomo") && $("filterHomo").value) n++;
  return n;
}
function sortList(list, mode) {
  const arr = list.slice();
  const titleKey = m => (m.title || "").toLowerCase();
  arr.sort((a, b) => {
    if (mode === "az") return titleKey(a).localeCompare(titleKey(b));
    if (mode === "za") return titleKey(b).localeCompare(titleKey(a));
    if (mode === "imdb") return numRating(b.publicRating) - numRating(a.publicRating);
    if (mode === "friend") return numRating(friendRatings[norm(b.title)]) - numRating(friendRatings[norm(a.title)]);
    if (mode === "added-old") return (a.addedAt || 0) - (b.addedAt || 0);
    if (mode === "rel-new" || mode === "rel-old") {
      const ra = releaseTime(a), rb = releaseTime(b);
      if (!ra && !rb) return 0;
      if (!ra) return 1;
      if (!rb) return -1;
      return mode === "rel-new" ? rb - ra : ra - rb;
    }
    return (b.addedAt || 0) - (a.addedAt || 0);
  });
  return arr;
}

  document.querySelectorAll("[data-pick]").forEach(el => {

function indexWatchCsv(text) {
  const lines = String(text || "").split(/\r?\n/).filter(l => l.trim());
  if (!lines.length) return { items: [], skipped: 0, empty: true, hasIds: false };
  const header = parseCsvLine(lines[0]).map(h => h.trim().toLowerCase());
  const titleIdx = header.findIndex(h => h === "title" || h === "name" || h === "movie");
  const idIdx = header.findIndex(h => h === "const" || h === "imdb id" || h === "tconst");
  const yearIdx = header.findIndex(h => h === "year");
  const typeIdx = header.findIndex(h => h === "title type");
  const ratingIdx = header.findIndex(h => h === "imdb rating");
  const isImdb = titleIdx >= 0 && idIdx >= 0;
  const items = [];
  let skipped = 0;
  if (!isImdb) {
    const start = titleIdx >= 0 ? 1 : 0;
    for (let i = start; i < lines.length; i++) {
      const cols = parseCsvLine(lines[i]);
      const title = (titleIdx >= 0 ? (cols[titleIdx] || "") : (cols[0] || "")).trim();
      if (title && title.toLowerCase() !== "title") items.push(watchItem({ title: title }));
    }
    return { items: items, skipped: 0, hasIds: false };
  }
  for (let i = 1; i < lines.length; i++) {
    const cols = parseCsvLine(lines[i]);
    const type = typeIdx >= 0 ? (cols[typeIdx] || "").trim() : "";
    if (type && RATING_SKIP[type.toLowerCase()]) { skipped++; continue; }
    const title = (cols[titleIdx] || "").trim();
    if (!title) continue;
    items.push({
      title: title,
      imdbId: (cols[idIdx] || "").trim(),
      year: yearIdx >= 0 ? (cols[yearIdx] || "").trim() : "",
      type: type,
      imdbRating: ratingIdx >= 0 ? (cols[ratingIdx] || "").trim() : ""
    });
  }
  return { items: items, skipped: skipped, hasIds: true };
}
async function saveWatch() {
  await idbPutMap("watch", { __list: myWatchlist });
  localStorage.removeItem("md_my_watch");
}
async function loadWatchFromDb() {
  try {
    const raw = await idbGetAll("watch");
    if (raw && Array.isArray(raw.__list)) {
      myWatchlist = raw.__list.map(watchItem);
      localStorage.removeItem("md_my_watch");
    } else if (myWatchlist.length) {
      await saveWatch();
    }
    if (currentSection === "watch") renderWatch();
  } catch (e) {}
}
function watchOwnedSets() {
  const titles = new Set();
  const ids = new Set();
  try {
    getAll().forEach(m => {
      if (m && m.title) titles.add(norm(m.title));
      if (m && m.imdbId) ids.add(m.imdbId);
    });
  } catch (e) {}
  return { titles: titles, ids: ids };
}
function watchRow(item, owned) {
  const title = watchTitle(item);
  const id = item && item.imdbId || "";
  const year = item && item.year || "";
  const rating = item && item.imdbRating || "";
  const have = owned && ((id && owned.ids.has(id)) || owned.titles.has(norm(title)));
  return '<div class="watch-row">' + escWatch(title)
    + (year ? ' <span class="sub">(' + escWatch(year) + ')</span>' : '')
    + (rating ? ' <span class="sub">IMDb ' + escWatch(rating) + '</span>' : '')
    + (id ? ' <span class="sub">' + escWatch(id) + '</span>' : '')
    + (have ? ' <span class="flag own">Owned</span>' : '')
    + '</div>';
}
function renderWatch() {
  const box = $("sectionOut");
  if (!box) return;
  const personal = watchMode !== "friend";
  const list = personal ? myWatchlist : friendWatchlist;
  const label = personal ? "Personal Watchlist" : "Friend Watchlist";
  const q = (($("watchQ") && $("watchQ").value) || "").trim().toLowerCase();
  const filtered = q ? list.filter(item => {
    const title = watchTitle(item).toLowerCase();
    const id = (item && item.imdbId || "").toLowerCase();
    return title.indexOf(q) !== -1 || id.indexOf(q) !== -1;
  }) : list;
  const cap = q ? 200 : 80;
  const shown = filtered.slice(0, cap);
  const owned = personal ? watchOwnedSets() : null;
  const lines = shown.map(item => watchRow(item, owned)).join("") || "<div style='color:#777'>Empty.</div>";
  const more = filtered.length > shown.length ? '<div class="sub">Showing ' + shown.length + ' of ' + filtered.length + '. Use the search box.</div>' : "";
  box.innerHTML = '<b>' + label + '</b> (' + list.length + ')<br>' + more + lines;
}
function showSharedWatch() {
  const mine = new Set(myWatchlist.map(t => normTitle(watchTitle(t))));
  const shared = friendWatchlist.filter(t => mine.has(normTitle(watchTitle(t))));
  const box = $("sectionOut");
  const lines = shared.slice(0, 80).map(t => watchRow(t, null)).join("") || "<div style='color:#777'>No shared titles.</div>";
  box.innerHTML = '<b>Shared Watchlist</b> (' + shared.length + ')<br>' + lines;
}
function loadMyWatch() {
  const el = $("myWatch");
  if (!el) return;
  el.onchange = e => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async () => {
      const result = indexWatchCsv(reader.result || "");
      if (result.empty) { showPopup("Empty file."); return; }
      myWatchlist = result.items;
      await saveWatch();
      const idNote = result.hasIds ? " IMDb ids kept." : " No IMDb ids in that file.";
      const skipNote = result.skipped ? " Skipped " + result.skipped + " episodes, games, and podcasts." : "";
      showPopup("Watchlist: " + result.items.length + "." + idNote + skipNote);
      if (currentSection !== "watch") showSection("watch");
      else renderWatch();
    };
    reader.readAsText(file);
  };
}

function loadListFile(inputId, setter, storageKey) {
  const el = $(inputId);
  if (!el) return;
  el.onchange = e => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const titles = parseFriendCsv(reader.result || "");
      setter(titles);
      localStorage.setItem(storageKey, JSON.stringify(titles));
      showPopup("Loaded " + titles.length + " titles");
      if (currentSection === "watch") renderWatch();
      if (currentSection === "inventory") render();
    };
    reader.readAsText(file);
  };
}

function loadRatingsFile() {
  const el = $("friendRatings");
  if (!el) return;
  el.onchange = e => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const text = reader.result || "";
      const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
      const header = (lines[0] || "").split(/[,;\t]/).map(h => h.trim().toLowerCase());
      const titleIdx = header.findIndex(h => h === "title" || h === "name");
      const ratingIdx = header.findIndex(h => h.includes("rating") || h === "your rating");
      const map = {};
      const start = (titleIdx >= 0 || ratingIdx >= 0) ? 1 : 0;
      for (let i = start; i < lines.length; i++) {
        const cols = lines[i].split(/[,;\t]/);
        const title = (cols[titleIdx >= 0 ? titleIdx : 0] || "").replace(/^["']|["']$/g, "").trim();
        const rating = (cols[ratingIdx >= 0 ? ratingIdx : 1] || "").replace(/^["']|["']$/g, "").trim();
        if (title) map[normTitle(title)] = rating;
      }
      friendRatings = map;
      localStorage.setItem("md_friend_ratings", JSON.stringify(friendRatings));
      showPopup("Friend ratings loaded: " + Object.keys(map).length);
      if (currentSection === "inventory") render();
      if (currentSection === "rated") showSection("rated");
    };
    reader.readAsText(file);
  };
}

$("friendName").oninput = () => { localStorage.setItem("md_friend_name", $("friendName").value); if (currentSection === "inventory") render(); };
$("friendName").value = localStorage.getItem("md_friend_name") || "";

loadListFile("friendInv", arr => { friendInvTitles = arr; }, "md_friend_inv");
loadRatingsFile();
loadMyWatch();
loadWatchFromDb();
loadListFile("friendWatch", arr => { friendWatchlist = arr; }, "md_friend_watch");
loadListFile("friendWatchData", arr => { friendWatchlist = arr; }, "md_friend_watch");

$("tabInventory").onclick = () => showSection("inventory");
$("tabAdd").onclick = () => showSection("add");
$("tabSettings").onclick = () => showSection("settings");
function renderBadgeSettings() {
  const map = badgeFxMap();
  const kinds = [["uhd","4K","Gold chrome","4K"],["blu","Blu-ray","Blue chrome","BLU"],["dvd","DVD","Silver chrome","DVD"]];
  const fxs = [["polish","Polished","Still chrome"],["shimmer","Shimmer","Light sweeps across"],["glow","Glow","Soft pulse"]];
  const box = $("badgeAppearance");
  if (!box) return;
  box.innerHTML = kinds.map(function(row) {
    const k = row[0], name = row[1], metal = row[2], text = row[3];
    const choices = fxs.map(function(fx) {
      const on = map[k] === fx[0] ? " on" : "";
      return '<button type="button" class="fx-pick' + on + '" data-kind="' + k + '" data-fx="' + fx[0] + '">'
        + discBadge(k, (function(){ const o = {uhd:"polish",blu:"polish",dvd:"polish"}; o[k] = fx[0]; return o; })())
        + '<span class="fx-name">' + fx[1] + '<br><span class="sub">' + fx[2] + '</span></span></button>';
    }).join("");
    return '<div class="fx-group"><div class="fx-head">' + name + ' <span class="sub">' + metal + '</span></div><div class="fx-choices">' + choices + '</div></div>';
  }).join("");
  box.querySelectorAll(".fx-pick").forEach(function(btn) {
    btn.onclick = function() {
      const m = badgeFxMap();
      m[btn.dataset.kind] = btn.dataset.fx;
      saveBadgeFx(m);
      renderBadgeSettings();
      render();
    };
  });
}
function showSettingsTab(which) {
  const data = $("setData"), look = $("setLook");
  if (data) data.style.display = which === "look" ? "none" : "block";
  if (look) look.style.display = which === "look" ? "block" : "none";
  if ($("setTabData")) $("setTabData").classList.toggle("active", which !== "look");
  if ($("setTabLook")) $("setTabLook").classList.toggle("active", which === "look");
  if (which === "look") renderBadgeSettings();
}
if ($("setTabData")) $("setTabData").onclick = () => showSettingsTab("data");
if ($("setTabLook")) $("setTabLook").onclick = () => showSettingsTab("look");
renderBadgeSettings();
$("tabWatch").onclick = () => showSection("watch");
$("q").oninput = () => render();
(function initInventoryTools() {
  const savedSort = localStorage.getItem("md_sort") || "added-new";
  if ($("sortSel")) $("sortSel").value = savedSort;
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem("md_filter") || "{}"); } catch (e) {}
  if ($("filterDisc")) $("filterDisc").value = saved.disc || "";
  if ($("filterBout")) $("filterBout").value = saved.bout || "";
  if ($("filterHomo")) $("filterHomo").value = saved.homo || "";
  function saveFilter() {
    localStorage.setItem("md_filter", JSON.stringify({
      disc: $("filterDisc").value,
      bout: $("filterBout").value,
      homo: $("filterHomo").value
    }));
    render();
  }
  $("filterBtn").onclick = () => $("filterPanel").classList.toggle("open");
  $("sortSel").onchange = () => { localStorage.setItem("md_sort", $("sortSel").value); render(); };
  $("filterDisc").onchange = saveFilter;
  $("filterBout").onchange = saveFilter;
  $("filterHomo").onchange = saveFilter;
  $("filterClear").onclick = () => {
    $("filterDisc").value = "";
    $("filterBout").value = "";
    $("filterHomo").value = "";
    saveFilter();
  };
  render();
})();
$("watchModePersonal").onclick = () => { watchMode = "personal"; renderWatch(); };
$("watchModeFriend").onclick = () => { watchMode = "friend"; renderWatch(); };
$("watchShared").onclick = showSharedWatch;
if ($("watchQ")) $("watchQ").oninput = () => { watchMode = "personal"; renderWatch(); };
function normTitle(s){ return (s||"").toLowerCase().replace(/[^a-z0-9]/g,""); }
function parseFriendCsv(text) {
  const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  if (!lines.length) return [];
  const header = lines[0].split(/[,;\t]/).map(h => h.trim().toLowerCase());
  const titleIdx = header.findIndex(h => h === "title" || h === "name" || h === "movie");
  const start = titleIdx >= 0 ? 1 : 0;
  const titles = [];
  for (let i = start; i < lines.length; i++) {
    const cols = lines[i].split(/[,;\t]/);
    const raw = titleIdx >= 0 ? (cols[titleIdx] || "") : cols[0];
    const t = raw.replace(/^["']|["']$/g, "").trim();
    if (t && t.toLowerCase() !== "title") titles.push(t);
  }
  return titles;
}
