<script>
const OMDB_KEY = "8d83ba51";
const UPCMDB_KEY = "d207a24928dc0f20f056afe5cb887437";
const UPCDATABASE_KEY = "7451A8510DEE05A60529AAE24745905D";
const $ = id => document.getElementById(id);
let collection = JSON.parse(localStorage.getItem("md_coll") || "[]");
let manualTitles = JSON.parse(localStorage.getItem("md_manual") || "[]");
let homoFlags = JSON.parse(localStorage.getItem("md_homo") || "{}");
let boutiqueFlags = JSON.parse(localStorage.getItem("md_boutique") || "{}");
const BOUTIQUE_LABELS = ["Arrow","Manta Labs","Kino Lorber","Criterion","Vinegar Syndrome","Severin","Scream Factory","Shout Factory","88 Films","Eureka","Indicator"];
function stripBoutique(label) {
  if (!label) return;
  const l = label.toLowerCase();
  const ids = Object.keys(boutiqueFlags).filter(id => (boutiqueFlags[id] || "").toLowerCase() === l);
  if (!ids.length) { showPopup("No titles marked " + label); return; }
  if (!confirm("Remove " + ids.length + " title(s) marked " + label + "?")) return;
  manualTitles = manualTitles.filter(m => !ids.includes(m.id));
  ids.forEach(id => delete boutiqueFlags[id]);
  saveManual();
  saveBoutique();
  render();
  showPopup("Stripped " + ids.length + " " + label + " title(s)");
}
let ratingsById = {};
let myRatings = {};
let dbPromise = null;
function openDb() {
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open("MovieDesk", 2);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains("ratings")) db.createObjectStore("ratings");
      if (!db.objectStoreNames.contains("boutique")) db.createObjectStore("boutique");
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return dbPromise;
}
async function idbGetAll(store) {
  const db = await openDb();
  return new Promise(resolve => {
    const tx = db.transaction(store, "readonly");
    const req = tx.objectStore(store).getAll();
    const keysReq = tx.objectStore(store).getAllKeys();
    let vals, keys;
    req.onsuccess = () => { vals = req.result; if (keys) finish(); };
    keysReq.onsuccess = () => { keys = keysReq.result; if (vals) finish(); };
    function finish() {
      const map = {};
      keys.forEach((k, i) => map[k] = vals[i]);
      resolve(map);
    }
  });
}
async function idbPutMap(store, map) {
  const db = await openDb();
  return new Promise(resolve => {
    const tx = db.transaction(store, "readwrite");
    const os = tx.objectStore(store);
    os.clear();
    Object.keys(map).forEach(k => os.put(map[k], k));
    tx.oncomplete = () => resolve();
  });
}
async function idbClear(store) {
  const db = await openDb();
  return new Promise(resolve => {
    const tx = db.transaction(store, "readwrite");
    tx.objectStore(store).clear();
    tx.oncomplete = () => resolve();
  });
}
async function loadRatingsFromDb() {
  try {
    myRatings = await idbGetAll("ratings");
    const n = Object.keys(myRatings).length;
    if (n && $("counts")) $("counts").textContent = (getAll ? getAll().length : 0) + " titles | " + n + " ratings indexed";
  } catch(e) {}
}
function parseCsvLine(line) {
  const out = [];
  let cur = "", inQ = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') { if (inQ && line[i+1] === '"') { cur += '"'; i++; } else inQ = !inQ; }
    else if (c === "," && !inQ) { out.push(cur); cur = ""; }
    else cur += c;
  }
  out.push(cur);
  return out;
}
function loadMyRatings() {
  const el = $("frat");
  if (!el) return;
  el.onchange = e => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async () => {
      const lines = (reader.result || "").split(/\r?\n/).filter(l => l.trim());
      if (!lines.length) { showPopup("Empty file."); return; }
      const header = parseCsvLine(lines[0]).map(h => h.trim().toLowerCase());
      const titleIdx = header.findIndex(h => h === "title");
      const ratingIdx = header.findIndex(h => h === "your rating");
      const imdbIdx = header.findIndex(h => h === "imdb rating");
      const map = {};
      for (let i = 1; i < lines.length; i++) {
        const cols = parseCsvLine(lines[i]);
        const title = (cols[titleIdx >= 0 ? titleIdx : 3] || "").trim();
        const rating = (cols[ratingIdx >= 0 ? ratingIdx : 1] || "").trim();
        if (title && rating) map[norm(title)] = rating;
      }
      myRatings = map;
      await idbPutMap("ratings", myRatings);
      localStorage.removeItem("md_my_ratings");
      showPopup("Your ratings indexed: " + Object.keys(map).length);
      render();
    };
    reader.readAsText(file);
  };
}
loadMyRatings();
loadRatingsFromDb();
let boutiqueCatalog = {};
async function loadBoutiqueCatalog() {
  try {
    boutiqueCatalog = await idbGetAll("boutique");
  } catch(e) {}
}
loadBoutiqueCatalog();
function lookupBoutique(barcode) {
  if (!barcode) return null;
  const clean = String(barcode).replace(/\D/g, "");
  if (!clean) return null;
  const tries = [clean, barcode];
  if (clean.length === 13 && clean.startsWith("0")) tries.push(clean.slice(1));
  if (clean.length === 12) tries.push("0" + clean);
  if (clean.length === 13) tries.push(clean.slice(1));
  if (clean.length === 12) tries.push(clean.slice(0, 12));
  for (const t of tries) {
    if (boutiqueCatalog[t]) return boutiqueCatalog[t];
  }
  return null;
}
function loadBoutiqueCsv() {
  const el = $("fboutique");
  if (!el) return;
  el.onchange = e => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async () => {
      const lines = (reader.result || "").split(/\r?\n/).filter(l => l.trim());
      if (!lines.length) { showPopup("Empty file."); return; }
      const header = parseCsvLine(lines[0]).map(h => h.trim().toLowerCase());
      const idx = name => header.findIndex(h => h === name || h.replace(/[^a-z]/g, "") === name.replace(/[^a-z]/g, ""));
      const bIdx = ["barcode","upc","ean","gtin"].map(idx).find(i => i >= 0);
      const tIdx = idx("title");
      const eIdx = ["edition","format"].map(idx).find(i => i >= 0);
      const lIdx = ["label","boutique","studio"].map(idx).find(i => i >= 0);
      const cIdx = ["coverurl","cover","cover_url","image","source_url","sourceurl"].map(idx).find(i => i >= 0);
      if (bIdx == null || bIdx < 0) { showPopup("Need a barcode / upc / ean column."); return; }
      const map = {};
      for (let i = 1; i < lines.length; i++) {
        const cols = parseCsvLine(lines[i]);
        const bc = (cols[bIdx] || "").replace(/\D/g, "");
        if (!bc) continue;
        map[bc] = {
          title: (tIdx >= 0 ? cols[tIdx] : "") || "",
          edition: (eIdx >= 0 ? cols[eIdx] : "") || "",
          label: (lIdx >= 0 ? cols[lIdx] : "") || "",
          coverUrl: (cIdx >= 0 ? cols[cIdx] : "") || ""
        };
      }
      boutiqueCatalog = map;
      await idbPutMap("boutique", boutiqueCatalog);
      showPopup("Boutique catalog indexed: " + Object.keys(map).length);
    };
    reader.readAsText(file);
  };
}
loadBoutiqueCsv();
let scanning = false;
let stream = null;
let scanTarget = null; // "mother" or "child"

function saveColl(){ localStorage.setItem("md_coll", JSON.stringify(collection)); }
function saveManual(){ localStorage.setItem("md_manual", JSON.stringify(manualTitles)); }
function saveHomo(){ localStorage.setItem("md_homo", JSON.stringify(homoFlags)); }
function saveBoutique(){ localStorage.setItem("md_boutique", JSON.stringify(boutiqueFlags)); }
function norm(s){ return (s||"").toLowerCase().replace(/[^a-z0-9]/g,""); }
let lastAddedId = "";
function showLastId(id, title){
  lastAddedId = id || "";
  const txt = $("lastIdText");
  if (txt) txt.textContent = id ? ("Last ID: " + id + (title ? " | " + title : "")) : "Last ID: -";
  const btn = $("lastIdCopy");
  if (btn) btn.dataset.copy = id || "";
}
$("stripBoutiqueBtn").onclick = () => {
  const label = prompt("Strip all titles marked with which boutique label?\n" + BOUTIQUE_LABELS.join(", "));
  if (label) stripBoutique(label.trim());
};
$("exportBtn").onclick = () => {
  const rows = [["title","barcode","type","motherId","boutique","homosexualScenes","imdbRating","friendRating"]];
  const name = ($("friendName") && $("friendName").value.trim()) || "";
  getAll().forEach(m => {
    const key = m.title + "|" + (m.barcode||"") + "|" + (m.edition||"");
    const bout = boutiqueFlags[m.id] || m.boutiqueLabel || "";
    const homo = homoFlags[key] ? "yes" : "no";
    const fr = friendRatings[norm(m.title)] || "";
    rows.push([
      m.title || "",
      m.barcode || "",
      m.isMother ? "mother" : "child",
      m.motherId || "",
      bout,
      homo,
      m.publicRating || "",
      fr
    ]);
  });
  const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n");
  const blob = new Blob([csv], { type: "text/csv" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "MovieDesk-export.csv";
  a.click();
  showPopup("Exported " + (rows.length - 1) + " titles" + (name ? " (friend: " + name + ")" : ""));
};
$("lastIdCopy").onclick = () => {
  const id = $("lastIdCopy").dataset.copy;
  if (!id) return;
  navigator.clipboard.writeText(id).then(() => {
    const old = $("lastIdCopy").textContent;
    $("lastIdCopy").textContent = "Copied";
    setTimeout(() => $("lastIdCopy").textContent = old, 1000);
  });
};

function showPopup(msg){
  if (sessionStorage.getItem("md_popup_off") === "1") return;
  if (localStorage.getItem("md_popup_off") === "1") return;
  const modal = $("modal");
  if (!modal) return;
  const msgEl = $("modalMsg");
  if (msgEl) msgEl.textContent = msg;
  modal.classList.add("show");
}
$("modalOk").onclick = () => {
  const modal = $("modal");
  if ($("modalDisable") && $("modalDisable").checked) localStorage.setItem("md_popup_off","1");
  if ($("modalSession") && $("modalSession").checked) sessionStorage.setItem("md_popup_off","1");
  if (modal) modal.classList.remove("show");
  if ($("modalDisable")) $("modalDisable").checked = false;
  if ($("modalSession")) $("modalSession").checked = false;
};

function getAll(){ return [...collection, ...manualTitles]; }
function getById(id){ return getAll().find(x => x.id === id); }

// Assign IDs to any entries that are missing them
function fixMissingIds(){
  let changed = false;
  [...collection, ...manualTitles].forEach(m => {
    if (!m.id) { m.id = makeId(); changed = true; }
  });
  if (changed) { saveColl(); saveManual(); }
}
fixMissingIds();

function makeId(){
  return "id-" + Math.random().toString(36).slice(2, 10);
}

function detectDiscType(raw) {
  if (!raw) return "";
  const s = String(raw);
  if (/ultra\s*hd|\buhd\b|\b4k\s*ultra\b|\b4k\b/i.test(s)) return "Ultra HD";
  if (/blu[- ]?ray|\bblu\b|\bbd\b/i.test(s)) return "Blu-ray";
  if (/\bdvd\b/i.test(s)) return "DVD";
  return "";
}

function cleanTitle(raw) {
  if (!raw) return "";
  let t = raw;
  // Strip common studio prefixes (Warner Brothers, Universal, etc.)
  t = t.replace(/^(Warner\s+Brothers|Warner\s+Bros\.?|Universal|Paramount|Sony|Columbia|Disney|MGM|20th\s+Century(\s+Fox)?|Lionsgate|Lions\s*Gate|New\s+Line|DreamWorks|Fox|Miramax|Orion|Touchstone|Hollywood\s+Pictures)\s+/i, "");
  // Strip common physical media suffixes and studio noise
  t = t.replace(/\s*[\(\[]?\s*(Blu[- ]?ray|BluRay|BD|DVD|4K|UHD|Ultra\s*HD|Digital|Combo|Disc|Edition|Special|Collector|Steelbook|Slipcover).*[\)\]]?/gi, "");
  t = t.replace(/\s*[---]\s*(Blu[- ]?ray|DVD|4K).*$/gi, "");
  t = t.replace(/\s*\d+\s*Disc(s)?\b/gi, "");
  t = t.replace(/\s*\([^)]*\)\s*$/g, ""); // trailing paren groups
  t = t.replace(/\s+/g, " ").trim();
  return t || raw;
}

async function trySource(name, url, parse) {
  try {
    const res = await fetch(url);
    if (!res.ok) return { name, ok: false, title: null, data: null };
    const data = await res.json();
    const title = parse(data);
    return { name, ok: !!title, title: title || null, data };
  } catch (e) {
    return { name, ok: false, title: null, data: null };
  }
}

async function refineWithOMDB(rawTitle) {
  const cleaned = cleanTitle(rawTitle);
  if (!cleaned || cleaned.length < 3) return { title: rawTitle, imdbId: "", rating: "", refined: false, discType: detectDiscType(rawTitle) };
  try {
    const res = await fetch(`https://www.omdbapi.com/?t=${encodeURIComponent(cleaned)}&apikey=${OMDB_KEY}`);
    const d = await res.json();
    if (d && d.Response === "True" && d.Title) {
      return {
        title: d.Title,
        imdbId: d.imdbID || "",
        rating: d.imdbRating || "",
        year: d.Year || "",
        release: d.Released || d.Year || "",
        runtime: d.Runtime || "",
        genres: d.Genre || "",
        director: d.Director || "",
        languages: d.Language || "",
        source: "OMDB",
        discType: detectDiscType(rawTitle),
        refined: true
      };
    }
  } catch (e) {}
  return { title: cleaned || rawTitle, imdbId: "", rating: "", refined: false, discType: detectDiscType(rawTitle) };
}

async function lookupBarcode(code) {
  const clean = (code || "").replace(/\D/g, "");
  if (!clean) return null;
  const candidates = [clean];
  if (clean.length === 13 && clean.startsWith("0")) candidates.push(clean.slice(1));
  if (clean.length === 12) candidates.push("0" + clean);

  const results = [];
  const matches = []; // {title, source}

  // Always try all sources on the primary barcode
  const c = candidates[0];

  // 1st: UPCMDB (movie-specific, 500/month)
  try {
    const res = await fetch(`https://us-central1-upcmdb-cbae5.cloudfunctions.net/api/v1/lookup/${encodeURIComponent(c)}`, {
      headers: { "x-api-key": UPCMDB_KEY }
    });
    if (res.ok) {
      const d = await res.json();
      const title = d.title || (d.data && d.data.title);
      results.push({ name: "UPCMDB", ok: !!title, title: title || null, data: d });
      if (title) {
        matches.push({ title, source: "UPCMDB", imdbId: d.imdbID || (d.data && d.data.imdbID) || "" });
        // good hit - skip the rest
      }
    } else {
      results.push({ name: "UPCMDB", ok: false, title: null, data: null });
    }
  } catch (e) {
    results.push({ name: "UPCMDB", ok: false, title: null, data: null });
  }

  // Only fall through if UPCMDB missed
  if (!matches.length) {
  // 2nd: UPCDatabase.org
  if (UPCDATABASE_KEY) {
    const upcdb = await trySource("UPCDatabase",
      `https://proxy.cors.dev/https://api.upcdatabase.org/product/${encodeURIComponent(c)}?apikey=${UPCDATABASE_KEY}`,
      d => (d.success && (d.title || d.itemname)) || null);
    results.push(upcdb);
    if (upcdb.title) matches.push({ title: upcdb.title, source: "UPCDatabase" });
  }

  // 3rd: GTINHub via CORS proxy
  const gtin = await trySource("GTINHub",
    `https://proxy.cors.dev/https://gtinhub.com/api/v1/product/${encodeURIComponent(c)}`,
    d => d.found && d.product && (d.product.name || d.product.title) || null);
  results.push(gtin);
  if (gtin.title) matches.push({ title: gtin.title, source: "GTINHub" });

  // 4th: UPCitemdb via proxy
  const upc = await trySource("UPCitemdb-proxy",
    `https://barcode-proxy.frankiymydear.workers.dev/?upc=${encodeURIComponent(c)}`,
    d => (d.items && d.items[0] && (d.items[0].title || d.items[0].description)) || null);
  results.push(upc);
  if (upc.title) matches.push({ title: upc.title, source: "UPCitemdb-proxy" });

  // UPCDatabase moved to 2nd
  if (!matches.length && candidates.length > 1) {
    for (const alt of candidates.slice(1)) {
      const altUpc = await trySource("UPCitemdb-proxy-alt",
        `https://barcode-proxy.frankiymydear.workers.dev/?upc=${encodeURIComponent(alt)}`,
        d => (d.items && d.items[0] && (d.items[0].title || d.items[0].description)) || null);
      results.push(altUpc);
      if (altUpc.title) {
        matches.push({ title: altUpc.title, source: "UPCitemdb-proxy" });
        break;
      }
    }
  }
  } // end UPCMDB fallback

  const status = $("barcodeStatus");
  if (status) {
    status.style.display = "block";
    const lines = results.map(r => (r.ok ? "OK" : "FAIL") + " - " + r.name).join("<br>");
    status.innerHTML = "<b>Barcode lookup:</b><br>" + lines +
      (matches.length ? "<br><b>Matches found:</b> " + matches.length : "");
  }

  return {
    matches,
    results,
    barcode: clean
  };
}

function stopScan() {
  scanning = false;
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null;
  $("scanner").style.display = "none";
  $("video").srcObject = null;
  scanTarget = null;
}

async function ensureBarcodeDetector() {
  if (window.BarcodeDetector) return true;
  return new Promise(resolve => {
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/barcode-detector@3/dist/iife/polyfill.min.js";
    s.onload = () => resolve(!!window.BarcodeDetector);
    s.onerror = () => resolve(false);
    document.head.appendChild(s);
  });
}

async function startScan(target) {
  if (scanning) { stopScan(); return; }
  const status = $("barcodeStatus");
  status.style.display = "block";
  status.innerHTML = "Starting camera...";
  if (!window.BarcodeDetector) {
    status.innerHTML = "Loading iPhone scanner...";
    const ok = await ensureBarcodeDetector();
    if (!ok) { showPopup("Barcode scanning not available in this browser."); return; }
  }
  scanTarget = target;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
    const video = $("video");
    video.srcObject = stream;
    $("scanner").style.display = "block";
    await video.play();
    scanning = true;
    const detector = new BarcodeDetector({ formats: ["ean_13","ean_8","upc_a","upc_e","code_128"] });

    // Wait until the video has frames
    status.innerHTML = "Focusing - hold steady...";
    let readyTries = 0;
    while (video.readyState < 2 && readyTries < 30 && scanning) {
      await new Promise(r => setTimeout(r, 100));
      readyTries++;
    }
    if (!scanning) return;
    status.innerHTML = "Ready - hold the barcode in frame (auto)";

    // Canvas path: more reliable on iPhone Safari than detect(video)
    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d", { willReadFrequently: true });

    let stable = null;
    let stableCount = 0;
    const loop = async () => {
      if (!scanning) return;
      try {
        if (video.videoWidth && video.videoHeight) {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        }
        const codes = await detector.detect(canvas);
        if (codes.length) {
          const raw = codes[0].rawValue;
          if (raw === stable) stableCount++;
          else { stable = raw; stableCount = 1; }
          status.innerHTML = "Saw: " + raw + " (" + stableCount + "/8) - hold steady";
          if (stableCount >= 8) {
            const rawFinal = raw;
            status.innerHTML = "Locked - " + rawFinal + "...";
            // short deliberate pause so the lock is visible
            await new Promise(r => setTimeout(r, 600));
            if (!scanning) return;
            stopScan();
            status.innerHTML = "Looking up " + rawFinal + "...";
            const result = await lookupBarcode(rawFinal);
            const field = target === "mother" ? $("motherTitle") : $("childTitle");
            const box = target === "mother" ? $("motherSuggest") : $("childSuggest");
            field.dataset.barcode = result ? result.barcode : rawFinal;
            const hits = (result && result.matches) || [];
            field.dataset.rawTitle = (hits[0] && hits[0].title) || rawFinal;
            field.dataset.discType = detectDiscType(field.dataset.rawTitle);
            if (hits.length) {
              box.innerHTML = hits.map(m => {
                const safe = (m.title || "").replace(/"/g, "&quot;");
                return `<div data-title="${safe}" data-source="${m.source}">${m.title} <span style="color:#888;font-size:0.75rem">(${m.source})</span></div>`;
              }).join("");
              box.classList.add("show");
              box.querySelectorAll("div").forEach(el => {
                el.onclick = () => {
                  field.value = el.dataset.title;
                  field.dataset.imdbId = "";
                  field.dataset.publicRating = "";
                  box.classList.remove("show");
                  showPopup("Selected: " + el.dataset.title);
                };
              });
              field.value = hits[0].title;
              showPopup(hits.length + " match" + (hits.length>1?"es":"") + " - pick one from the list.");
            } else {
              field.value = rawFinal;
              box.classList.remove("show");
              showPopup("Scanned " + rawFinal + " - no title match.");
            }
            return;
          }
        } else {
          stable = null;
          stableCount = 0;
          status.innerHTML = "Looking... hold the barcode steady (auto)";
        }
      } catch (e) {
        status.innerHTML = "Detect error: " + (e.message || e);
      }
      if (scanning) requestAnimationFrame(loop);
    };
    loop();
  } catch (e) {
    showPopup("Could not start camera: " + (e.message || e));
    stopScan();
  }
}

function boutiqueSuggest(query, box) {
  const digits = (query || "").replace(/\D/g, "");
  if (digits.length < 8) return false;
  const hits = [];
  const keys = Object.keys(boutiqueCatalog);
  for (let i = 0; i < keys.length && hits.length < 33; i++) {
    const bc = keys[i];
    if (bc.indexOf(digits) === -1) continue;
    const row = boutiqueCatalog[bc];
    if (row) hits.push({ barcode: bc, title: row.title || bc, label: row.label || "", edition: row.edition || "", coverUrl: row.coverUrl || "" });
  }
  if (!hits.length) return false;
  box.innerHTML = hits.map(h => `<div data-barcode="${h.barcode}" data-title="${(h.title||"").replace(/"/g,"&quot;")}" data-label="${(h.label||"").replace(/"/g,"&quot;")}" data-edition="${(h.edition||"").replace(/"/g,"&quot;")}" data-cover="${(h.coverUrl||"").replace(/"/g,"&quot;")}">${h.title}${h.label ? " | " + h.label : ""}${h.edition ? " | " + h.edition : ""}<br><span style="color:#888;font-size:0.75rem">${h.barcode}</span></div>`).join("");
  box.classList.add("show");
  box.querySelectorAll("div").forEach(el => {
    el.onclick = () => {
      const field = box.id === "motherSuggest" ? $("motherTitle") : $("childTitle");
      field.value = el.dataset.title || el.dataset.barcode;
      field.dataset.barcode = el.dataset.barcode || "";
      field.dataset.boutiqueLabel = el.dataset.label || "";
      field.dataset.edition = el.dataset.edition || "";
      field.dataset.coverUrl = el.dataset.cover || "";
      box.classList.remove("show");
    };
  });
  return true;
}
async function barcodeExternalSuggest(query, box) {
  const digits = (query || "").replace(/\D/g, "");
  if (digits.length < 10) return false;
  try {
    const result = await lookupBarcode(digits);
    if (!result || !result.matches || !result.matches.length) return false;
    box.innerHTML = result.matches.slice(0, 20).map(m => {
      const t = (m.title || "").replace(/"/g, """);
      return `<div data-barcode="${digits}" data-title="${t}" data-id="${m.imdbId || ""}">${m.title}<br><span style="color:#888;font-size:0.75rem">${digits} | ${m.source || "lookup"}</span></div>`;
    }).join("");
    box.classList.add("show");
    box.querySelectorAll("div").forEach(el => {
      el.onclick = () => {
        const field = box.id === "motherSuggest" ? $("motherTitle") : $("childTitle");
        field.value = el.dataset.title || digits;
        field.dataset.barcode = el.dataset.barcode || "";
        field.dataset.imdbId = el.dataset.id || "";
        box.classList.remove("show");
      };
    });
    return true;
  } catch (e) {
    return false;
  }
}

async function omdbSuggest(query, box) {
  if (boutiqueSuggest(query, box)) return;
  const digits = (query || "").replace(/\D/g, "");
  if (digits.length >= 10 && digits.length >= (query || "").length - 2) {
    if (await barcodeExternalSuggest(query, box)) return;
  }
  if (!query || query.length < 3) { box.classList.remove("show"); return; }
  try {
    const pages = [1, 2, 3, 4];
    const all = [];
    for (const p of pages) {
      if (all.length >= 33) break;
      const res = await fetch(`https://www.omdbapi.com/?s=${encodeURIComponent(query)}&page=${p}&apikey=${OMDB_KEY}`);
      const d = await res.json();
      if (!d.Search || !d.Search.length) break;
      all.push(...d.Search);
      if (d.Search.length < 10) break;
    }
    if (all.length) {
      box.innerHTML = all.slice(0, 33).map(m => `<div data-title="${m.Title}" data-id="${m.imdbID}">${m.Title} (${m.Year})</div>`).join("");
      box.classList.add("show");
      box.querySelectorAll("div").forEach(el => {
        el.onclick = () => {
          const field = box.id === "motherSuggest" ? $("motherTitle") : $("childTitle");
          field.value = el.dataset.title;
          field.dataset.imdbId = el.dataset.id;
          box.classList.remove("show");
        };
      });
    } else box.classList.remove("show");
  } catch(e) { box.classList.remove("show"); }
}

function render() {
  const q = norm($("q").value);
  let all = getAll();
  if (q) {
    const matches = all.filter(m => norm(m.title).includes(q));
    const ids = new Set(matches.map(m => m.id));
    matches.forEach(m => {
      if (m.motherId && !ids.has(m.motherId)) {
        const mother = getById(m.motherId);
        if (mother) ids.add(mother.id);
      }
    });
    all = all.filter(m => ids.has(m.id));
  }
  $("counts").textContent = `${all.length} shown / ${getAll().length} total`;
  $("out").innerHTML = all.slice(0,80).map(m => {
    const key = m.title + "|" + (m.barcode||"") + "|" + (m.edition||"");
    const isYes = !!homoFlags[key];
    const bout = boutiqueFlags[m.id] || m.boutiqueLabel || "";
    const boutNote = bout ? `<span class="flag" style="background:#5a3a00;color:#ffd580" data-boutique="${m.id}">Boutique: ${bout}</span>` : `<span class="flag" style="background:#333;color:#aaa" data-boutique="${m.id}">+ Boutique</span>`;
    const pkgNote = m.fromPackage ? `<span class="flag pkg" data-mother-id="${m.motherId||""}" style="cursor:pointer">From mother</span>` : "";
    const childDrop = (m.isMother && m.children && m.children.length)
      ? (function() {
          const opts = m.children.map(function(cid) {
            const c = getById(cid);
            if (!c) return "";
            const t = String(c.title || cid).replace(/&/g, "&").replace(/</g, "<");
            const extra = c.discType ? " | " + c.discType : "";
            return '<option value="' + cid + '">' + t + extra + '</option>';
          }).join("");
          return '<select class="child-drop" size="5" data-mother="' + m.id + '"><option value="">Children (' + m.children.length + ')</option>' + opts + '</select>';
        })()
      : "";
    const friendTag = friendTagFor(m.title);
    const cover = m.coverUrl ? `<img class="card-cover" src="${m.coverUrl}" alt="">` : `<div class="card-cover"></div>`;
    return `<div class="card">
      ${cover}
      <div class="card-body">
        <div class="card-title" data-id="${m.id||""}" data-mother="${m.isMother ? m.id : ""}">${m.title}${friendTag}</div>
        <div class="card-meta">${m.year || ""}${m.discType ? " | " + m.discType : ""}${m.edition ? " | " + m.edition : ""}</div>
        <div class="card-flags">
          <span class="flag own">Owned</span>
          ${childDrop}
          ${pkgNote}
          ${boutNote}
          <span class="flag ${isYes?"gay-yes":"gay-no"}" data-key="${key}">Homo: ${isYes?"yes":"no"}</span>
          <span class="flag imdb">IMDb: ${m.publicRating||"-"}</span>
          ${myRatings[norm(m.title)] ? `<span class="flag" style="background:#1a2a3a;color:#8ab4f8">You: ${myRatings[norm(m.title)]}</span>` : ""}
        </div>
      </div>
    </div>`;
  }).join("") || `<div style="text-align:center;color:#777;padding:40px">No titles</div>`;

  document.querySelectorAll(".flag[data-key]").forEach(el => {
    el.onclick = () => {
      const k = el.dataset.key;
      homoFlags[k] = !homoFlags[k];
      saveHomo();
      render();
    };
  });
  document.querySelectorAll("[data-boutique]").forEach(el => {
    el.onclick = () => {
      const id = el.dataset.boutique;
      const current = boutiqueFlags[id] || "";
      const next = prompt("Boutique label (blank to clear):\n" + BOUTIQUE_LABELS.join(", "), current);
      if (next === null) return;
      const label = (next || "").trim();
      if (label) boutiqueFlags[id] = label;
      else delete boutiqueFlags[id];
      saveBoutique();
      render();
    };
  });
  document.querySelectorAll(".child-drop").forEach(el => {
    el.onclick = (e) => e.stopPropagation();
    el.onchange = () => {
      const id = el.value;
      el.value = "";
      if (id) openEdit(id);
    };
  });
  document.querySelectorAll(".card-title[data-mother]").forEach(el => {
    el.onclick = () => {
      const id = el.dataset.id || "";
      const title = el.textContent.trim();
      if (id) showLastId(id, title);
      openEdit(el.dataset.id);
    };
  });
  document.querySelectorAll("button[data-copy]").forEach(btn => {
    btn.onclick = () => {
      navigator.clipboard.writeText(btn.dataset.copy).then(() => {
        const old = btn.textContent;
        btn.textContent = "Copied";
        setTimeout(() => btn.textContent = old, 1000);
      });
    };
  });
}

  m.audioChannels = ($("editAudioChannels").value || "").trim();
  m.edition = ($("editEdition").value || "").trim();
  m.release = ($("editRelease").value || "").trim();
  m.languages = ($("editLanguages").value || "").trim();
  m.subtitles = ($("editSubtitles").value || "").trim();
  m.runtime = ($("editRuntime").value || "").trim();
  m.genres = ($("editGenres").value || "").trim();
  m.director = ($("editDirector").value || "").trim();
  m.composer = ($("editComposer").value || "").trim();
  m.cinematographer = ($("editCinematographer").value || "").trim();
  m.notes = ($("editNotes").value || "").trim();
  m.coverUrl = ($("editCoverUrl").value || "").trim();
  if (manualTitles.some(x => x.id === id)) saveManual();
  else saveColl();
  $("editPanel").classList.remove("show");
  render();
};
$("editCancel").onclick = () => $("editPanel").classList.remove("show");

$("motherTitle").oninput = () => omdbSuggest($("motherTitle").value, $("motherSuggest"));
$("childTitle").oninput = () => omdbSuggest($("childTitle").value, $("childSuggest"));

$("motherAddBtn").onclick = async () => {
  try {
    const field = $("motherTitle");
    let t = (field.value || "").trim();
    if (!t && field.dataset.barcode) t = field.dataset.barcode;
    if (!t) { showPopup("Nothing to add."); return; }
    const typedBarcode = (/^\d{8,14}$/.test(t)) ? t : "";
    const barcode = field.dataset.barcode || typedBarcode;
    const m = makeMother(t, {
      barcode: barcode,
      imdbId: field.dataset.imdbId || "",
      publicRating: field.dataset.publicRating || "",
      rawTitle: field.dataset.rawTitle || t,
      discType: field.dataset.discType || detectDiscType(field.dataset.rawTitle || t),
      boutiqueLabel: field.dataset.boutiqueLabel || "",
      edition: field.dataset.edition || "",
      coverUrl: field.dataset.coverUrl || ""
    });
    const boutHit = lookupBoutique(barcode);
    if (boutHit) {
      if (!m.boutiqueLabel && boutHit.label) m.boutiqueLabel = boutHit.label;
      if (!m.edition && boutHit.edition) m.edition = boutHit.edition;
      if (!m.coverUrl && boutHit.coverUrl) m.coverUrl = boutHit.coverUrl;
      if (boutHit.title && /^\d+$/.test(String(m.title || ""))) m.title = boutHit.title;
      if (boutHit.label) { boutiqueFlags[m.id] = boutHit.label; saveBoutique(); }
    }
    try {
      const r = await refineWithOMDB(field.dataset.rawTitle || t);
      if (r.refined) {
        if (!m.imdbId && r.imdbId) m.imdbId = r.imdbId;
        if (!m.publicRating && r.rating) m.publicRating = r.rating;
        if (!m.release && r.release) m.release = r.release;
        if (!m.runtime && r.runtime) m.runtime = r.runtime;
        if (!m.genres && r.genres) m.genres = r.genres;
        if (!m.director && r.director) m.director = r.director;
        if (!m.languages && r.languages) m.languages = r.languages;
        if (!m.source && r.source) m.source = r.source;
        if (!m.discType && r.discType) m.discType = r.discType;
      }
    } catch(e) {}
    manualTitles.unshift(m);
    saveManual();
    manualTitles = JSON.parse(localStorage.getItem("md_manual") || "[]");
    field.value = "";
    field.dataset.barcode = "";
    field.dataset.imdbId = "";
    field.dataset.publicRating = "";
    $("motherSuggest").classList.remove("show");
    showPopup("Added: " + m.title + " | ID: " + m.id + (boutHit ? " | Boutique: " + (boutHit.label || "matched") : " | no boutique match") + " | Total: " + getAll().length);
    showLastId(m.id, m.title);
    render();
    if ($("counts")) $("counts").textContent = getAll().length + " shown / " + getAll().length + " total";
  } catch(err) {
    showPopup("Add failed: " + (err && err.message ? err.message : err));
  }
};

$("childAddBtn").onclick = () => {
  const t = $("childTitle").value.trim();
  const mid = $("motherIdInput").value.trim();
  if (!t || !mid) { showPopup("Need child title and mother ID."); return; }
  const mother = getById(mid);
  if (!mother || !mother.isMother) { showPopup("Mother ID not found."); return; }
  const typedBarcode = (/^\d{8,14}$/.test(t)) ? t : "";
  const barcode = $("childTitle").dataset.barcode || typedBarcode || mother.barcode || "";
  const c = makeChild(t, mid, { barcode: barcode, imdbId: $("childTitle").dataset.imdbId || "", publicRating: $("childTitle").dataset.publicRating || "" });
  const boutHit = lookupBoutique(barcode);
  if (boutHit) {
    if (!c.boutiqueLabel && boutHit.label) c.boutiqueLabel = boutHit.label;
    if (!c.edition && boutHit.edition) c.edition = boutHit.edition;
    if (!c.coverUrl && boutHit.coverUrl) c.coverUrl = boutHit.coverUrl;
    if (boutHit.title && /^\d+$/.test(c.title)) c.title = boutHit.title;
    if (boutHit.label) { boutiqueFlags[c.id] = boutHit.label; saveBoutique(); }
  }
  manualTitles.push(c);
  mother.children = mother.children || [];
  mother.children.push(c.id);
  saveManual();
  $("childTitle").value = "";
  $("childTitle").dataset.barcode = "";
  $("childTitle").dataset.imdbId = "";
  $("childTitle").dataset.publicRating = "";
  $("motherIdInput").value = "";
  $("childSuggest").classList.remove("show");
  showPopup("Child added to mother: " + c.title);
  showLastId(c.id, c.title);
  render();
};

$("childScanBtn").onclick = () => { $("barcodeStatus").style.display = "block"; $("barcodeStatus").innerHTML = "Scan tapped"; startScan("child"); };

$("buyBtn").onclick = async () => {
  const q = $("buyQuery").value.trim();

  const box = $("buyResults");
  try {
    const res = await fetch(`https://www.omdbapi.com/?s=${encodeURIComponent(q)}&apikey=${OMDB_KEY}`);

let friendInvTitles = JSON.parse(localStorage.getItem("md_friend_inv") || "[]");
let friendRatings = JSON.parse(localStorage.getItem("md_friend_ratings") || "{}");
let myWatchlist = JSON.parse(localStorage.getItem("md_my_watch") || "[]");
let friendWatchlist = JSON.parse(localStorage.getItem("md_friend_watch") || "[]");
let currentSection = "inventory";
let watchMode = "personal";

function friendTagFor(title) {
  const n = normTitle(title);
  const inInv = friendInvTitles.some(t => normTitle(t) === n);
  const rating = friendRatings[n];
  if (!inInv && !rating) return "";
  const name = ($("friendName") && $("friendName").value.trim()) || "Friend";
  const r = rating ? " | " + rating : "";
  return ` <span class="flag" style="background:#2a1a3a;color:#d0a0e0;margin-left:6px;">${name}${r}</span>`;
}

function showSettings() {
  const stores = [
    { key: "md_manual", label: "Manual titles (added in app)", data: manualTitles },
    { key: "md_coll", label: "Loaded collection", data: collection },
    { key: "md_my_ratings", label: "Your IMDb ratings", data: myRatings },
    { key: "md_friend_inv", label: "Friend inventory", data: friendInvTitles },
    { key: "md_friend_ratings", label: "Friend ratings", data: friendRatings },
    { key: "md_my_watch", label: "Personal watchlist", data: myWatchlist },
    { key: "md_friend_watch", label: "Friend watchlist", data: friendWatchlist },
    { key: "md_homo", label: "Homosexual-scenes flags", data: homoFlags },
    { key: "md_boutique", label: "Boutique labels", data: boutiqueFlags },
    { key: "boutique-catalog", label: "Boutique catalog (barcode index)", data: boutiqueCatalog }
  ];
  const box = $("sectionOut");
  const rows = stores.map(s => {
    const n = Array.isArray(s.data) ? s.data.length : Object.keys(s.data || {}).length;
    return `<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #2a2a2a;">
      <div>${s.label}<br><span style="color:#888;font-size:0.75rem">${s.key} | ${n} items</span></div>
      <button data-clear="${s.key}" style="height:28px;padding:0 10px;font-size:0.75rem;background:#3a1a1a;color:#f88;">Clear</button>
    </div>`;
  }).join("");
  box.innerHTML = `<b>Settings - stored in this browser</b>
    <div style="color:#888;font-size:0.8rem;margin:6px 0 10px;">Nothing is saved to a folder until you tap Export Library. Exported CSVs go to your phone/browser Downloads folder.</div>
    ${rows}`;
  box.querySelectorAll("[data-clear]").forEach(btn => {
    btn.onclick = () => {
      const key = btn.dataset.clear;
      if (!confirm("Clear " + key + "?")) return;
      localStorage.removeItem(key);
      if (key === "md_manual") manualTitles = [];
      if (key === "md_coll") collection = [];
      if (key === "md_my_ratings") { myRatings = {}; idbClear("ratings"); }
      if (key === "md_friend_inv") friendInvTitles = [];
      if (key === "md_friend_ratings") friendRatings = {};
      if (key === "md_my_watch") myWatchlist = [];
      if (key === "md_friend_watch") friendWatchlist = [];
      if (key === "md_homo") Object.keys(homoFlags).forEach(k => delete homoFlags[k]);
      if (key === "md_boutique") Object.keys(boutiqueFlags).forEach(k => delete boutiqueFlags[k]);
      if (key === "boutique-catalog") { boutiqueCatalog = {}; idbClear("boutique"); }
      showPopup("Cleared " + key);
      showSettings();
      render();
    };
  });
}
function showSection(name) {
  currentSection = name;
  $("watchControls").style.display = name === "watch" ? "block" : "none";
  $("out").style.display = name === "inventory" ? "block" : "none";
  $("q").style.display = name === "inventory" ? "block" : "none";
  const box = $("sectionOut");
  if (name === "inventory") { box.innerHTML = ""; render(); return; }
  if (name === "rated") {
    const mine = getAll().filter(m => m.publicRating);
    const lines = mine.slice(0,60).map(m => {
      const fr = friendRatings[normTitle(m.title)];
      const name = ($("friendName") && $("friendName").value.trim()) || "Friend";
      return `<div>${m.title} | IMDb: ${m.publicRating||"-"}${fr ? " | " + name + ": " + fr : ""}</div>`;
    }).join("") || "<div style='color:#777'>No rated titles yet.</div>";
    box.innerHTML = "<b>Rated</b><br>" + lines;
    return;
  }
  if (name === "watch") renderWatch();
}

function renderWatch() {
  const box = $("sectionOut");
  const list = watchMode === "friend" ? friendWatchlist : myWatchlist;
  const label = watchMode === "friend" ? "Friend Watchlist" : "Personal Watchlist";
  const lines = list.slice(0,60).map(t => `<div>${t}</div>`).join("") || "<div style='color:#777'>Empty.</div>";
  box.innerHTML = `<b>${label}</b> (${list.length})<br>` + lines;
}

function showSharedWatch() {
  const mine = new Set(myWatchlist.map(normTitle));
  const shared = friendWatchlist.filter(t => mine.has(normTitle(t)));
  const box = $("sectionOut");
  const lines = shared.slice(0,60).map(t => `<div>${t}</div>`).join("") || "<div style='color:#777'>No shared titles.</div>";
  box.innerHTML = `<b>Shared Watchlist</b> (${shared.length})<br>` + lines;
}

function loadListFile(inputId, setter, storageKey) {
  const el = $(inputId);
  if (!el) return;
  el.onchange = e => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const titles = parseFriendCsv(reader.result || "");
      setter(titles);
      localStorage.setItem(storageKey, JSON.stringify(titles));
      showPopup("Loaded " + titles.length + " titles");
      if (currentSection === "watch") renderWatch();
      if (currentSection === "inventory") render();
    };
    reader.readAsText(file);
  };
}

function loadRatingsFile() {
  const el = $("friendRatings");
  if (!el) return;
  el.onchange = e => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const text = reader.result || "";
      const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
      const header = (lines[0] || "").split(/[,;\t]/).map(h => h.trim().toLowerCase());
      const titleIdx = header.findIndex(h => h === "title" || h === "name");
      const ratingIdx = header.findIndex(h => h.includes("rating") || h === "your rating");
      const map = {};
      const start = (titleIdx >= 0 || ratingIdx >= 0) ? 1 : 0;
      for (let i = start; i < lines.length; i++) {
        const cols = lines[i].split(/[,;\t]/);
        const title = (cols[titleIdx >= 0 ? titleIdx : 0] || "").replace(/^["']|["']$/g, "").trim();
        const rating = (cols[ratingIdx >= 0 ? ratingIdx : 1] || "").replace(/^["']|["']$/g, "").trim();
        if (title) map[normTitle(title)] = rating;
      }
      friendRatings = map;
      localStorage.setItem("md_friend_ratings", JSON.stringify(friendRatings));
      showPopup("Friend ratings loaded: " + Object.keys(map).length);
      if (currentSection === "inventory") render();
      if (currentSection === "rated") showSection("rated");
    };
    reader.readAsText(file);
  };
}

$("friendName").oninput = () => { localStorage.setItem("md_friend_name", $("friendName").value); if (currentSection === "inventory") render(); };
$("friendName").value = localStorage.getItem("md_friend_name") || "";

loadListFile("friendInv", arr => { friendInvTitles = arr; }, "md_friend_inv");
loadRatingsFile();
loadListFile("myWatch", arr => { myWatchlist = arr; }, "md_my_watch");
loadListFile("friendWatch", arr => { friendWatchlist = arr; }, "md_friend_watch");
loadListFile("friendWatchData", arr => { friendWatchlist = arr; }, "md_friend_watch");

$("tabInventory").onclick = () => showSection("inventory");
$("tabSettings").onclick = () => { currentSection = "settings"; $("watchControls").style.display = "none"; $("out").style.display = "none"; $("q").style.display = "none"; showSettings(); };
$("tabRated").onclick = () => showSection("rated");
$("tabWatch").onclick = () => showSection("watch");
$("watchModePersonal").onclick = () => { watchMode = "personal"; renderWatch(); };
$("watchModeFriend").onclick = () => { watchMode = "friend"; renderWatch(); };
$("watchShared").onclick = showSharedWatch;
function normTitle(s){ return (s||"").toLowerCase().replace(/[^a-z0-9]/g,""); }
function parseFriendCsv(text) {
  const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  if (!lines.length) return [];
  const header = lines[0].split(/[,;\t]/).map(h => h.trim().toLowerCase());
  const titleIdx = header.findIndex(h => h === "title" || h === "name" || h === "movie");
  const start = titleIdx >= 0 ? 1 : 0;
  const titles = [];
  for (let i = start; i < lines.length; i++) {
    const cols = lines[i].split(/[,;\t]/);
    const raw = titleIdx >= 0 ? (cols[titleIdx] || "") : cols[0];
    const t = raw.replace(/^["']|["']$/g, "").trim();
    if (t && t.toLowerCase() !== "title") titles.push(t);
  }
  return titles;
}
