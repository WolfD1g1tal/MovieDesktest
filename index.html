<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Movie Desk 0.6.7</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #0e0e0e; color: #eee; }
  header { padding: 16px; border-bottom: 1px solid #222; position: sticky; top: 0; background: #0e0e0e; z-index: 10; }
  h1 { margin: 0; }
  .sub { color: #888; font-size: 0.8rem; }
  main { padding: 16px; max-width: 680px; margin: 0 auto; }
  input[type=search], input[type=text] { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid #333; background: #1a1a1a; color: #fff; margin: 6px 0; box-sizing: border-box; }
  .add-wrap, .buy-wrap { position: relative; margin-bottom: 8px; }
  .add-row, .buy-row { display: flex; gap: 8px; align-items: center; }
  .add-row input, .buy-row input { flex: 1; margin: 0; }
  button { background: #222; color: #eee; border: 1px solid #444; padding: 0 16px; border-radius: 12px; cursor: pointer; height: 48px; }
  .suggest, .buy-results { position: absolute; top: 100%; left: 0; right: 0; background: #1a1a1a; border: 1px solid #333; border-radius: 8px; max-height: 240px; overflow-y: auto; z-index: 20; display: none; }
  .suggest.show, .buy-results.show { display: block; }
  .suggest div, .buy-results div { padding: 12px 14px; cursor: pointer; border-bottom: 1px solid #2a2a2a; }
  .suggest div:hover, .buy-results div:hover { background: #2a2a2a; }
  #scanner { display: none; margin: 12px 0; }
  #scanner video { width: 100%; border-radius: 12px; background: #000; }
  .card { background: #161616; border: 1px solid #2a2a2a; border-radius: 12px; padding: 14px; margin-bottom: 10px; }
  .title { font-weight: 500; cursor: pointer; }
  .child-list { margin-top: 8px; margin-left: 24px; border-left: 2px solid #6a3a8a; padding-left: 10px; display: none; }
  .child-list.show { display: block; }
  .child-item { background: #2a1a3a; border: 1px solid #5a3a7a; border-radius: 6px; padding: 8px; margin: 4px 0; color: #d0a0e0; }
  .flag { padding: 4px 10px; border-radius: 999px; font-size: 0.78rem; font-weight: 600; }
  .own { background: #1a3a2a; color: #7dcea0; }
  .gay-no { background: #1a2a3a; color: #8ab4e0; cursor: pointer; }
  .gay-yes { background: #3a1a2a; color: #e08ab4; cursor: pointer; }
  .imdb { background: #2a2a1a; color: #e0c07a; }
  .you { background: #0a2a2a; color: #00e5ff; }
  .pkg { background: #2a1a2a; color: #e0a07a; }
  .child-list { margin-top: 8px; border-top: 1px solid #333; padding-top: 8px; }
  .child-item { background: #222; border: 1px solid #444; border-radius: 6px; padding: 8px; margin: 4px 0; }
  label.load { display: inline-block; background: #222; border: 1px solid #444; padding: 10px 14px; border-radius: 8px; cursor: pointer; margin-right: 8px; }
  input[type=file] { display: none; }
  .section-label { color: #888; font-size: 0.85rem; margin: 16px 0 4px; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 100; }
  .modal.show { display: flex; }
  .modal-box { background: #1a1a1a; border: 1px solid #333; border-radius: 16px; padding: 20px; max-width: 320px; width: 90%; }
  .modal-box p { margin: 0 0 16px; white-space: pre-line; }
  .modal-box label { display: block; margin: 8px 0; font-size: 0.9rem; }
  .modal-box button { height: auto; background: #333; color: #fff; border: none; padding: 10px 20px; border-radius: 8px; float: right; }
</style>
</head>
<body>
<header>
  <h1>Movie Desk 0.6.8</h1>
  <div class="sub" id="counts">Ready</div>
</header>
<main>
  <div>
    <label class="load">Load Collection CSV<input type="file" id="fcol" accept=".csv"></label>
    <label class="load">Load Ratings CSV<input type="file" id="frat" accept=".csv"></label>
  </div>

  <div class="section-label">Add Mother (package / single title)</div>
  <div class="add-wrap">
    <div class="add-row">
      <input type="text" id="motherTitle" placeholder="Mother title or barcode…" autocomplete="off">
      <button id="motherAddBtn">Add Mother</button>
      <button id="motherScanBtn">Scan</button>
    </div>
    <div class="suggest" id="motherSuggest"></div>
  </div>

  <div class="section-label">Add Child to Mother</div>
  <div id="lastIdBar" style="font-size:0.8rem;color:#aaa;margin:2px 0 8px;display:flex;align-items:center;gap:8px;">
    <span id="lastIdText">Last ID: —</span>
    <button id="lastIdCopy" style="height:22px;padding:0 8px;font-size:0.7rem;background:#333;border:1px solid #555;color:#fff;">Copy</button>
  </div>
  <div class="add-wrap">
    <div class="add-row">
      <input type="text" id="childTitle" placeholder="Child title or barcode…" autocomplete="off">
      <input type="text" id="motherIdInput" placeholder="Mother ID" style="max-width:140px">
      <button id="childAddBtn">Add Child</button>
      <button id="childScanBtn">Scan</button>
    </div>
    <div class="suggest" id="childSuggest"></div>
  </div>

  <div class="section-label">Buy Lookup</div>
  <div class="buy-wrap">
    <div class="buy-row">
      <input type="text" id="buyQuery" placeholder="Search to buy…" autocomplete="off">
      <button id="buyBtn">Search</button>
    </div>
    <div class="buy-results" id="buyResults"></div>
  </div>

  <div id="barcodeStatus" style="display:none; font-size:0.75rem; color:#aaa; margin:6px 0 10px; padding:8px; background:#161616; border-radius:8px; border:1px solid #2a2a2a;"></div>
  <div id="scanner"><video id="video" autoplay playsinline></video></div>
  <input type="search" id="q" placeholder="Search your titles…">
  <div id="out"></div>
</main>

<div class="modal" id="modal">
  <div class="modal-box">
    <p id="modalMsg"></p>
    <label><input type="checkbox" id="modalDisable"> Disable</label>
    <label><input type="checkbox" id="modalSession"> Disable for this session</label>
    <button id="modalOk">OK</button>
  </div>
</div>

<script>
const OMDB_KEY = "8d83ba51";
const $ = id => document.getElementById(id);
let collection = JSON.parse(localStorage.getItem("md_coll") || "[]");
let manualTitles = JSON.parse(localStorage.getItem("md_manual") || "[]");
let homoFlags = JSON.parse(localStorage.getItem("md_homo") || "{}");
let ratingsById = {};
let scanning = false;
let stream = null;
let scanTarget = null; // "mother" or "child"

function saveColl(){ localStorage.setItem("md_coll", JSON.stringify(collection)); }
function saveManual(){ localStorage.setItem("md_manual", JSON.stringify(manualTitles)); }
function saveHomo(){ localStorage.setItem("md_homo", JSON.stringify(homoFlags)); }
function norm(s){ return (s||"").toLowerCase().replace(/[^a-z0-9]/g,""); }
let lastAddedId = "";
function showLastId(id, title){
  lastAddedId = id || "";
  const txt = $("lastIdText");
  if (txt) txt.textContent = id ? ("Last ID: " + id + (title ? " · " + title : "")) : "Last ID: —";
  const btn = $("lastIdCopy");
  if (btn) btn.dataset.copy = id || "";
}
$("lastIdCopy").onclick = () => {
  const id = $("lastIdCopy").dataset.copy;
  if (!id) return;
  navigator.clipboard.writeText(id).then(() => {
    const old = $("lastIdCopy").textContent;
    $("lastIdCopy").textContent = "Copied";
    setTimeout(() => $("lastIdCopy").textContent = old, 1000);
  });
};

function showPopup(msg){
  if (sessionStorage.getItem("md_popup_off") === "1") return;
  if (localStorage.getItem("md_popup_off") === "1") return;
  $("modalMsg").textContent = msg;
  $("modal").classList.add("show");
}
$("modalOk").onclick = () => {
  if ($("modalDisable").checked) localStorage.setItem("md_popup_off","1");
  if ($("modalSession").checked) sessionStorage.setItem("md_popup_off","1");
  $("modal").classList.remove("show");
  $("modalDisable").checked = false;
  $("modalSession").checked = false;
};

function getAll(){ return [...collection, ...manualTitles]; }
function getById(id){ return getAll().find(x => x.id === id); }

// Assign IDs to any entries that are missing them
function fixMissingIds(){
  let changed = false;
  [...collection, ...manualTitles].forEach(m => {
    if (!m.id) { m.id = makeId(); changed = true; }
  });
  if (changed) { saveColl(); saveManual(); }
}
fixMissingIds();

function makeMother(title, extra={}){
  return {
    id: makeId(),
    title,
    barcode: extra.barcode || "",
    isMother: true,
    diskCount: extra.diskCount || 1,
    children: extra.children || [],
    motherId: null,
    fromPackage: null,
    imdbId: extra.imdbId || "",
    publicRating: extra.publicRating || "",
    edition: extra.edition || "",
    notes: extra.notes || ""
  };
}
function makeChild(title, motherId, extra={}){
  return {
    id: makeId(),
    title,
    barcode: extra.barcode || "",
    isMother: false,
    motherId,
    fromPackage: motherId,
    imdbId: extra.imdbId || "",
    publicRating: extra.publicRating || "",
    edition: extra.edition || "",
    notes: extra.notes || ""
  };
}

function cleanTitle(raw) {
  if (!raw) return "";
  let t = raw;
  // Strip common physical media suffixes and studio noise
  t = t.replace(/\s*[\(\[]?\s*(Blu[- ]?ray|BluRay|BD|DVD|4K|UHD|Ultra\s*HD|Digital|Combo|Pack|Disc|Edition|Special|Collector|Steelbook|Slipcover).*[\)\]]?/gi, "");
  t = t.replace(/\s*[-–—]\s*(Blu[- ]?ray|DVD|4K).*$/gi, "");
  t = t.replace(/\s*\d+\s*Disc(s)?\b/gi, "");
  t = t.replace(/\s*\([^)]*\)\s*$/g, ""); // trailing paren groups
  t = t.replace(/\s+/g, " ").trim();
  return t || raw;
}

async function trySource(name, url, parse) {
  try {
    const res = await fetch(url);
    if (!res.ok) return { name, ok: false, title: null, data: null };
    const data = await res.json();
    const title = parse(data);
    return { name, ok: !!title, title: title || null, data };
  } catch (e) {
    return { name, ok: false, title: null, data: null };
  }
}

async function refineWithOMDB(rawTitle) {
  const cleaned = cleanTitle(rawTitle);
  if (!cleaned || cleaned.length < 3) return { title: rawTitle, imdbId: "", rating: "", refined: false };
  try {
    const res = await fetch(`https://www.omdbapi.com/?t=${encodeURIComponent(cleaned)}&apikey=${OMDB_KEY}`);
    const d = await res.json();
    if (d && d.Response === "True" && d.Title) {
      return {
        title: d.Title,
        imdbId: d.imdbID || "",
        rating: d.imdbRating || "",
        year: d.Year || "",
        refined: true
      };
    }
  } catch (e) {}
  return { title: cleaned || rawTitle, imdbId: "", rating: "", refined: false };
}

async function lookupBarcode(code) {
  const clean = (code || "").replace(/\D/g, "");
  if (!clean) return null;
  const candidates = [clean];
  if (clean.length === 13 && clean.startsWith("0")) candidates.push(clean.slice(1));
  if (clean.length === 12) candidates.push("0" + clean);

  const results = [];
  let foundTitle = null;
  let sourceName = "none";

  for (const c of candidates) {
    if (foundTitle) break;

    // 1st: GTINHub (tended to return more precise titles in testing)
    const gtin = await trySource("GTINHub",
      `https://gtinhub.com/api/v1/product/${encodeURIComponent(c)}`,
      d => d.found && d.product && (d.product.name || d.product.title) || null);
    results.push(gtin);
    if (gtin.title) {
      foundTitle = gtin.title;
      sourceName = "GTINHub";
    }

    // 2nd: OpenLibrary (books / occasional media)
    if (!foundTitle) {
      const ol = await trySource("OpenLibrary",
        `https://openlibrary.org/isbn/${encodeURIComponent(c)}.json`,
        d => d.title);
      results.push(ol);
      if (ol.title) {
        foundTitle = ol.title;
        sourceName = "OpenLibrary";
      }
    }

    // 3rd: UPCitemdb via proxy (general product DB; less precise for some packs)
    if (!foundTitle) {
      const upc = await trySource("UPCitemdb-proxy",
        `https://barcode-proxy.frankiymydear.workers.dev/?upc=${encodeURIComponent(c)}`,
        d => (d.items && d.items[0] && (d.items[0].title || d.items[0].description)) || null);
      results.push(upc);
      if (upc.title) {
        foundTitle = upc.title;
        sourceName = "UPCitemdb-proxy";
      }
    }
  }

  let refined = { title: foundTitle, imdbId: "", rating: "", refined: false };
  if (foundTitle) {
    refined = await refineWithOMDB(foundTitle);
  }

  const status = $("barcodeStatus");
  if (status) {
    status.style.display = "block";
    const lines = results.map(r => (r.ok ? "OK" : "FAIL") + " — " + r.name).join("<br>");
    const extra = refined.refined ? `<br><b>OMDB refined:</b> ${refined.title}${refined.rating ? " · " + refined.rating : ""}` : "";
    status.innerHTML = "<b>Barcode lookup:</b><br>" + lines + extra;
  }

  return {
    title: refined.title || foundTitle,
    imdbId: refined.imdbId || "",
    publicRating: refined.rating || "",
    source: sourceName,
    results,
    barcode: clean,
    refined: refined.refined
  };
}

function stopScan() {
  scanning = false;
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null;
  $("scanner").style.display = "none";
  $("video").srcObject = null;
  scanTarget = null;
}

async function startScan(target) {
  if (scanning) { stopScan(); return; }
  if (!window.BarcodeDetector) { showPopup("Barcode scanning not supported. Use Chrome on Android."); return; }
  scanTarget = target;
  const status = $("barcodeStatus");
  status.style.display = "block";
  status.innerHTML = "Starting camera…";
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
    const video = $("video");
    video.srcObject = stream;
    $("scanner").style.display = "block";
    await video.play();
    scanning = true;
    const detector = new BarcodeDetector({ formats: ["ean_13","ean_8","upc_a","upc_e","code_128"] });

    // Wait until the video has frames
    status.innerHTML = "Focusing — hold steady…";
    let readyTries = 0;
    while (video.readyState < 2 && readyTries < 30 && scanning) {
      await new Promise(r => setTimeout(r, 100));
      readyTries++;
    }
    if (!scanning) return;
    status.innerHTML = "Ready — hold the barcode in frame";

    let stable = null;
    let stableCount = 0;
    const loop = async () => {
      if (!scanning) return;
      try {
        const codes = await detector.detect(video);
        if (codes.length) {
          const raw = codes[0].rawValue;
          status.innerHTML = "Saw: " + raw + " (" + stableCount + ")";
          if (raw === stable) stableCount++;
          else { stable = raw; stableCount = 1; }
          if (stableCount >= 8) {
            const rawFinal = raw;
            stopScan();
            status.innerHTML = "Looking up " + rawFinal + "…";
            const result = await lookupBarcode(rawFinal);
            const title = result && result.title ? result.title : null;
            const field = target === "mother" ? $("motherTitle") : $("childTitle");
            field.value = title || rawFinal;
            field.dataset.barcode = result ? result.barcode : rawFinal;
            if (result && result.imdbId) field.dataset.imdbId = result.imdbId;
            if (result && result.publicRating) field.dataset.publicRating = result.publicRating;
            field.setAttribute("value", field.value);
            // close any open suggest so it doesn't overwrite the scanned title
            $("motherSuggest").classList.remove("show");
            $("childSuggest").classList.remove("show");
            const note = result && result.refined ? " (OMDB refined)" : "";
            showPopup(title ? "Found via " + result.source + note + ": " + title : "Scanned " + rawFinal + " — no title match.");
            return;
          }
        } else {
          stable = null;
          stableCount = 0;
          status.innerHTML = "Looking… hold the barcode steady";
        }
      } catch (e) {
        status.innerHTML = "Detect error: " + (e.message || e);
      }
      if (scanning) requestAnimationFrame(loop);
    };
    loop();
  } catch (e) {
    showPopup("Could not start camera: " + (e.message || e));
    stopScan();
  }
}

async function omdbSuggest(query, box) {
  if (!query || query.length < 3) { box.classList.remove("show"); return; }
  try {
    const res = await fetch(`https://www.omdbapi.com/?s=${encodeURIComponent(query)}&apikey=${OMDB_KEY}`);
    const d = await res.json();
    if (d.Search) {
      box.innerHTML = d.Search.slice(0,8).map(m => `<div data-title="${m.Title}" data-id="${m.imdbID}">${m.Title} (${m.Year})</div>`).join("");
      box.classList.add("show");
      box.querySelectorAll("div").forEach(el => {
        el.onclick = () => {
          const field = box.id === "motherSuggest" ? $("motherTitle") : $("childTitle");
          field.value = el.dataset.title;
          field.dataset.imdbId = el.dataset.id;
          box.classList.remove("show");
        };
      });
    } else box.classList.remove("show");
  } catch(e) { box.classList.remove("show"); }
}

function render() {
  const q = norm($("q").value);
  let all = getAll();
  if (q) {
    const matches = all.filter(m => norm(m.title).includes(q));
    const ids = new Set(matches.map(m => m.id));
    matches.forEach(m => {
      if (m.motherId && !ids.has(m.motherId)) {
        const mother = getById(m.motherId);
        if (mother) ids.add(mother.id);
      }
    });
    all = all.filter(m => ids.has(m.id));
  }
  $("counts").textContent = `${all.length} shown / ${getAll().length} total`;
  $("out").innerHTML = all.slice(0,80).map(m => {
    const key = m.title + "|" + (m.barcode||"") + "|" + (m.edition||"");
    const isYes = !!homoFlags[key];
    const pkgNote = m.fromPackage ? `<span class="flag pkg">From mother</span>` : "";
    const childHtml = (m.isMother && m.children && m.children.length)
      ? `<div class="child-list" data-mother="${m.id}">${m.children.map(cid => { const c = getById(cid); return c ? `<div class="child-item">${c.title}${c.barcode ? " · " + c.barcode : ""}</div>` : ""; }).join("")}</div>`
      : "";
    return `<div class="card">
      <div class="title" data-mother="${m.isMother ? m.id : ""}">${m.title}</div>
      <div style="color:#aaa;font-size:0.85rem;margin:4px 0">ID: ${m.id||"missing"}${m.isMother?" · Mother":""}${m.barcode?" · Barcode: "+m.barcode:""} <button data-copy="${m.id||''}" style="height:22px;padding:0 8px;font-size:0.7rem;margin-left:6px;background:#333;border:1px solid #555;color:#fff;">Copy ID</button></div>
      <div class="flags">
        <span class="flag own">Owned</span>
        ${pkgNote}
        <span class="flag ${isYes?"gay-yes":"gay-no"}" data-key="${key}">Homosexual scenes: ${isYes?"yes":"no"}</span>
        <span class="flag imdb">IMDb: ${m.publicRating||"—"}</span>
      </div>
      ${childHtml}
    </div>`;
  }).join("") || `<div style="text-align:center;color:#777;padding:40px">No titles</div>`;

  document.querySelectorAll(".flag[data-key]").forEach(el => {
    el.onclick = () => {
      const k = el.dataset.key;
      homoFlags[k] = !homoFlags[k];
      saveHomo();
      render();
    };
  });
  document.querySelectorAll(".title[data-mother]").forEach(el => {
    const mid = el.dataset.mother;
    el.onclick = () => {
      if (mid) {
        const list = document.querySelector(`.child-list[data-mother="${mid}"]`);
        if (list) list.classList.toggle("show");
      }
      const card = el.closest(".card");
      const idLine = card && card.querySelector("button[data-copy]");
      const id = idLine ? idLine.dataset.copy : "";
      const title = el.textContent.trim();
      if (id) showLastId(id, title);
    };
  });
  document.querySelectorAll("button[data-copy]").forEach(btn => {
    btn.onclick = () => {
      navigator.clipboard.writeText(btn.dataset.copy).then(() => {
        const old = btn.textContent;
        btn.textContent = "Copied";
        setTimeout(() => btn.textContent = old, 1000);
      });
    };
  });
}

$("motherTitle").oninput = () => omdbSuggest($("motherTitle").value, $("motherSuggest"));
$("childTitle").oninput = () => omdbSuggest($("childTitle").value, $("childSuggest"));

$("motherAddBtn").onclick = () => {
  const field = $("motherTitle");
  let t = (field.value || "").trim();
  if (!t && field.dataset.barcode) t = field.dataset.barcode;
  if (!t) { showPopup("Nothing to add."); return; }
  // Ensure we always have a usable title string even if lookup was partial
  const m = makeMother(t, {
    barcode: field.dataset.barcode || "",
    imdbId: field.dataset.imdbId || "",
    publicRating: field.dataset.publicRating || ""
  });
  manualTitles.unshift(m);
  saveManual();
  // re-read to confirm persistence
  manualTitles = JSON.parse(localStorage.getItem("md_manual") || "[]");
  field.value = "";
  field.dataset.barcode = "";
  field.dataset.imdbId = "";
  field.dataset.publicRating = "";
  $("motherSuggest").classList.remove("show");
  showPopup("Added: " + m.title + " | ID: " + m.id + " | Total: " + getAll().length);
  showLastId(m.id, m.title);
  render();
  if ($("counts")) $("counts").textContent = getAll().length + " shown / " + getAll().length + " total";
};

$("childAddBtn").onclick = () => {
  const t = $("childTitle").value.trim();
  const mid = $("motherIdInput").value.trim();
  if (!t || !mid) { showPopup("Need child title and mother ID."); return; }
  const mother = getById(mid);
  if (!mother || !mother.isMother) { showPopup("Mother ID not found."); return; }
  const c = makeChild(t, mid, { barcode: $("childTitle").dataset.barcode || mother.barcode || "", imdbId: $("childTitle").dataset.imdbId || "", publicRating: $("childTitle").dataset.publicRating || "" });
  manualTitles.push(c);
  mother.children = mother.children || [];
  mother.children.push(c.id);
  saveManual();
  $("childTitle").value = "";
  $("childTitle").dataset.barcode = "";
  $("childTitle").dataset.imdbId = "";
  $("childTitle").dataset.publicRating = "";
  $("motherIdInput").value = "";
  $("childSuggest").classList.remove("show");
  showPopup("Child added to mother: " + c.title);
  showLastId(c.id, c.title);
  render();
};

$("motherScanBtn").onclick = () => startScan("mother");
$("childScanBtn").onclick = () => startScan("child");

$("buyBtn").onclick = async () => {
  const q = $("buyQuery").value.trim();
  if (!q) return;
  const box = $("buyResults");
  try {
    const res = await fetch(`https://www.omdbapi.com/?s=${encodeURIComponent(q)}&apikey=${OMDB_KEY}`);
    const d = await res.json();
    if (d.Search) {
      box.innerHTML = d.Search.slice(0,8).map(m => `<div>${m.Title} (${m.Year})</div>`).join("");
      box.classList.add("show");
    } else box.classList.remove("show");
  } catch(e) { box.classList.remove("show"); }
};

$("q").oninput = render;
render();
</script>
</body>
</html>
